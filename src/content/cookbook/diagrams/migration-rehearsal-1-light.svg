<svg id="d-migration-rehearsal-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 516px;" viewBox="-280 -154 516 384" role="img" aria-labelledby="d-migration-rehearsal-1-light-title d-migration-rehearsal-1-light-desc"><title id="d-migration-rehearsal-1-light-title">Data model: the company directory; the migration renames HAS_CEO to LED_BY and adds industry</title><desc id="d-migration-rehearsal-1-light-desc">An Organization is linked to its chief executive, a Person, by HAS_CEO, which the migration renames to LED_BY; the migration also adds an industry property to Organization. Each Organization has HAS_CATEGORY to an IndustryCategory and IN_CITY to a City, and each City is IN_COUNTRY a Country.</desc><style>#d-migration-rehearsal-1-light{font-family:"Relate Sans",system-ui,sans-serif}#d-migration-rehearsal-1-light text{text-anchor:middle}#d-migration-rehearsal-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-migration-rehearsal-1-light .dash{stroke-dasharray:6 4}#d-migration-rehearsal-1-light .head{fill:#A5ABB6}#d-migration-rehearsal-1-light .node circle{stroke-width:2}#d-migration-rehearsal-1-light .label{font-size:14px;font-weight:600;fill:#0A1114}#d-migration-rehearsal-1-light .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-migration-rehearsal-1-light .type,#d-migration-rehearsal-1-light .rprops{stroke:#F2F2F2;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-migration-rehearsal-1-light .type{font-size:12px;font-weight:600;fill:#0A1114}#d-migration-rehearsal-1-light .rprops{font-size:11px;font-weight:400;fill:#59656A}</style><g><path class="rel" d="M-119.5,89.6 C-146.9,46.8 -174.4,4.1 -201.8,-38.7"/><path class="head" d="M-205.6,-44.6 L-196.4,-38.6 L-204,-33.7 Z"/><path class="rel" d="M-55.1,84.4 C-36.9,42.2 -18.7,0 -0.5,-42.1"/><path class="head" d="M2.3,-48.5 L2.5,-37.6 L-5.8,-41.1 Z"/><path class="rel" d="M-15.2,133.3 C10.3,128 35.8,122.7 61.3,117.3"/><path class="head" d="M68.2,115.9 L59.3,122.4 L57.5,113.5 Z"/><path class="rel" d="M121.2,71.4 C135.1,35 149.1,-1.4 163.1,-37.8"/><path class="head" d="M165.6,-44.4 L166.2,-33.4 L157.8,-36.6 Z"/></g><g><g class="node" transform="translate(-82.4,147.4)"><circle r="68.7" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-31.2" dy="0.35em">Organization</text><text class="props" y="-14.3" dy="0.35em">id · name</text><text class="props" y="1.3" dy="0.35em">founded · employees</text><text class="props" y="16.9" dy="0.35em">isPublic · summary</text><text class="props" y="32.5" dy="0.35em">industry</text></g><g class="node" transform="translate(-227.1,-78.2)"><circle r="38.9" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-7.8" dy="0.35em">Person</text><text class="props" y="9.1" dy="0.35em">id · name</text></g><g class="node" transform="translate(21.6,-93.1)"><circle r="47.6" fill="#F79767" stroke="#C17650"/><text class="label" y="-16.9" dy="0.35em">Industry</text><text class="label" y="1.3" dy="0.35em">Category</text><text class="props" y="18.2" dy="0.35em">id · name</text></g><g class="node" transform="translate(107.2,107.7)"><circle r="38.9" fill="#56C7E4" stroke="#439BB2"/><text class="label" y="-7.8" dy="0.35em">City</text><text class="props" y="9.1" dy="0.35em">id · name</text></g><g class="node" transform="translate(180.7,-83.9)"><circle r="41.3" fill="#D8C7AE" stroke="#A89B88"/><text class="label" y="-7.8" dy="0.35em">Country</text><text class="props" y="9.1" dy="0.35em">id · name</text></g></g><g><g transform="translate(-162.5,22.5) rotate(57.3)"><text class="type" y="0" dy="0.35em">HAS_CEO → LED_BY</text></g><g transform="translate(-26.4,17.9) rotate(-66.6)"><text class="type" y="0" dy="0.35em">HAS_CATEGORY</text></g><g transform="translate(26.5,124.6) rotate(-11.8)"><text class="type" y="0" dy="0.35em">IN_CITY</text></g><g transform="translate(143.4,13.5) rotate(-69)"><text class="type" y="0" dy="0.35em">IN_COUNTRY</text></g></g></svg>
