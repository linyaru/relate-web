<svg id="d-problems-relate-solves-5-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 474px;" viewBox="-244 -100 474 206" role="img" aria-labelledby="d-problems-relate-solves-5-light-title d-problems-relate-solves-5-light-desc"><title id="d-problems-relate-solves-5-light-title">Recommended data model for bi-temporal facts: decisions about entities, the decisions they replace, and reviews</title><desc id="d-problems-relate-solves-5-light-desc">A Decision is ABOUT an Entity and carries two time ranges: validFrom and validTo for when it held, recordedAt and closedAt for when it was believed. A Decision SUPERSEDES the one it replaces, and a Review REJECTS a Decision.</desc><style>#d-problems-relate-solves-5-light{font-family:"Public Sans",system-ui,sans-serif}#d-problems-relate-solves-5-light text{text-anchor:middle}#d-problems-relate-solves-5-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-problems-relate-solves-5-light .dash{stroke-dasharray:6 4}#d-problems-relate-solves-5-light .head{fill:#A5ABB6}#d-problems-relate-solves-5-light .node circle{stroke-width:2}#d-problems-relate-solves-5-light .label{font-size:14px;font-weight:600;fill:#181414}#d-problems-relate-solves-5-light .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-problems-relate-solves-5-light .type,#d-problems-relate-solves-5-light .rprops{stroke:#FCF9F6;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-problems-relate-solves-5-light .type{font-size:12px;font-weight:600;fill:#181414}#d-problems-relate-solves-5-light .rprops{font-size:11px;font-weight:400;fill:#4F4E4D}</style><g><path class="rel" d="M65.8,14.7 C90.6,8.1 115.4,1.6 140.2,-5"/><path class="head" d="M146.9,-6.8 L138.4,0.1 L136.1,-8.6 Z"/><path class="rel" d="M-8.9,-29.6 C-42.5,-76.9 55.1,-77.7 25.4,-36.2"/><path class="head" d="M21.3,-30.5 L23.5,-41.3 L30.8,-36 Z"/><path class="rel" d="M-145.6,-4.7 C-117.8,1.7 -90,8.2 -62.2,14.7"/><path class="head" d="M-55.4,16.3 L-66.2,18.4 L-64.1,9.6 Z"/></g><g><g class="node" transform="translate(5.9,30.5)"><circle r="62" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-31.2" dy="0.35em">Decision</text><text class="props" y="-14.3" dy="0.35em">id · text</text><text class="props" y="1.3" dy="0.35em">validFrom · validTo</text><text class="props" y="16.9" dy="0.35em">recordedAt</text><text class="props" y="32.5" dy="0.35em">closedAt</text></g><g class="node" transform="translate(181.8,-16)"><circle r="35" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-7.8" dy="0.35em">Entity</text><text class="props" y="9.1" dy="0.35em">name</text></g><g class="node" transform="translate(-187.7,-14.5)"><circle r="43.2" fill="#F79767" stroke="#C17650"/><text class="label" y="-15.6" dy="0.35em">Review</text><text class="props" y="1.3" dy="0.35em">by · at</text><text class="props" y="16.9" dy="0.35em">reason</text></g></g><g><g transform="translate(106.4,4) rotate(-14.8)"><text class="type" y="0" dy="0.35em">ABOUT</text></g><g transform="translate(6.3,-77.4)"><text class="type" y="0" dy="0.35em">SUPERSEDES</text></g><g transform="translate(-100.5,5.8) rotate(13.1)"><text class="type" y="0" dy="0.35em">REJECTS</text></g></g></svg>
