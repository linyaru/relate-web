<svg id="d-entity-resolution-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 682px;" viewBox="-313 -191 682 378" role="img" aria-labelledby="d-entity-resolution-1-dark-title d-entity-resolution-1-dark-desc"><title id="d-entity-resolution-1-dark-title">Data model: records, the entities they resolve to, and the words and edges that match entities</title><desc id="d-entity-resolution-1-dark-desc">Records from the CRM (Record:Crm) and from billing (Record:Billing) each RESOLVES_TO an Entity. An Entity HAS_TOKEN the words of its name, and tokens are SIMILAR to one another by a Dice score. Between two entities, CANDIDATE holds a scored pair with its domain and city matches, SAME_AS a scored match, and POSSIBLE_MATCH a doubtful pair with its reason.</desc><style>#d-entity-resolution-1-dark{font-family:"Relate Sans",system-ui,sans-serif}#d-entity-resolution-1-dark text{text-anchor:middle}#d-entity-resolution-1-dark .rel{fill:none;stroke:#80808A;stroke-width:2}#d-entity-resolution-1-dark .dash{stroke-dasharray:6 4}#d-entity-resolution-1-dark .head{fill:#80808A}#d-entity-resolution-1-dark .node circle{stroke-width:2}#d-entity-resolution-1-dark .label{font-size:14px;font-weight:600;fill:#0A1114}#d-entity-resolution-1-dark .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-entity-resolution-1-dark .type,#d-entity-resolution-1-dark .rprops{stroke:#18181C;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-entity-resolution-1-dark .type{font-size:12px;font-weight:600;fill:#F1F1F3}#d-entity-resolution-1-dark .rprops{font-size:11px;font-weight:400;fill:#9B9BA3}</style><g><path class="rel" d="M-114.1,-65.6 C-87.4,-35.2 -60.8,-4.8 -34.1,25.5"/><path class="head" d="M-29.5,30.8 L-39.5,26.3 L-32.7,20.3 Z"/><path class="rel" d="M-171.7,98.8 C-132.1,92 -92.5,85.3 -52.9,78.5"/><path class="head" d="M-46,77.3 L-55.1,83.5 L-56.6,74.6 Z"/><path class="rel" d="M22.1,22.7 C35.2,-10.4 48.3,-43.5 61.3,-76.6"/><path class="head" d="M63.9,-83