<svg id="d-problems-relate-solves-7-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 289px;" viewBox="-152 -62 289 131" role="img" aria-labelledby="d-problems-relate-solves-7-dark-title d-problems-relate-solves-7-dark-desc"><title id="d-problems-relate-solves-7-dark-title">Recommended data model for hybrid retrieval: notes about topics, some of which record a decision</title><desc id="d-problems-relate-solves-7-dark-desc">A Note has text, a timestamp and an embedding, and is ABOUT a Topic. A Note that records a decision also has a DECIDED relationship to the Topic, carrying the decision's text and timestamp.</desc><style>#d-problems-relate-solves-7-dark{font-family:"Relate Sans",system-ui,sans-serif}#d-problems-relate-solves-7-dark text{text-anchor:middle}#d-problems-relate-solves-7-dark .rel{fill:none;stroke:#80808A;stroke-width:2}#d-problems-relate-solves-7-dark .dash{stroke-dasharray:6 4}#d-problems-relate-solves-7-dark .head{fill:#80808A}#d-problems-relate-solves-7-dark .node circle{stroke-width:2}#d-problems-relate-solves-7-dark .label{font-size:14px;font-weight:600;fill:#0A1114}#d-problems-relate-solves-7-dark .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-problems-relate-solves-7-dark .type,#d-problems-relate-solves-7-dark .rprops{stroke:#18181C;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-problems-relate-solves-7-dark .type{font-size:12px;font-weight:600;fill:#F1F1F3}#d-problems-relate-solves-7-dark .rprops{font-size:11px;font-weight:400;fill:#9B9BA3}</style><g><path class="rel" d="M-45.5,-21.5 C-15.2,-36.4 17.2,-35.5 51.5,-18.6"/><path class="head" d="M57.8,-15.5 L46.8,-15.9 L50.8,-23.9 Z"/><path class="rel" d="M-45.5,21.5 C-15.2,36.4 17.2,35.5 51.5,18.6"/><path class="head" d="M57.8,15.5 L50.8,23.9 L46.8,15.9 Z"/></g><g><g class="node" transform="translate(-89.3,0)"><circle r="48.8" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-15.6" dy="0.35em">Note</text><text class="props" y="1.3" dy="0.35em">id · text · ts</text><text class="props" y="16.9" dy="0.35em">embedding</text></g><g class="node" transform="translate(89.3,0)"><circle r="34.1" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-7.8" dy="0.35em">Topic</text><text class="props" y="9.1" dy="0.35em">name</text></g></g><g><g transform="translate(3.1,-31.2) rotate(3.3)"><text class="type" y="0" dy="0.35em">ABOUT</text></g><g transform="translate(3.1,31.2) rotate(-3.3)"><text class="type" y="0" dy="0.35em">DECIDED</text><text class="rprops" y="15" dy="0.35em">text · ts</text></g></g></svg>
