<svg id="d-git-to-graph-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 525px;" viewBox="-262 -121 525 188" role="img" aria-labelledby="d-git-to-graph-1-light-title d-git-to-graph-1-light-desc"><title id="d-git-to-graph-1-light-title">Data model: people author commits, commits touch files, files change together</title><desc id="d-git-to-graph-1-light-desc">A Person AUTHORED each Commit they wrote, and a Commit TOUCHED every File it changed. Two files that changed in the same commits are joined by CO_CHANGED, whose count is the number of those commits.</desc><style>#d-git-to-graph-1-light{font-family:"Public Sans",system-ui,sans-serif}#d-git-to-graph-1-light text{text-anchor:middle}#d-git-to-graph-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-git-to-graph-1-light .dash{stroke-dasharray:6 4}#d-git-to-graph-1-light .head{fill:#A5ABB6}#d-git-to-graph-1-light .node circle{stroke-width:2}#d-git-to-graph-1-light .label{font-size:14px;font-weight:600;fill:#181414}#d-git-to-graph-1-light .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-git-to-graph-1-light .type,#d-git-to-graph-1-light .rprops{stroke:#FCF9F6;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-git-to-graph-1-light .type{font-size:12px;font-weight:600;fill:#181414}#d-git-to-graph-1-light .rprops{font-size:11px;font-weight:400;fill:#4F4E4D}</style><g><path class="rel" d="M-163,2.8 C-130.7,-0.7 -98.4,-4.2 -66.1,-7.7"/><path class="head" d="M-59.2,-8.5 L-68.6,-2.9 L-69.6,-11.9 Z"/><path class="rel" d="M61.3,-8.4 C91.1,-5 121,-1.7 150.8,1.7"/><path class="head" d="M157.8,2.4 L147.3,5.8 L148.3,-3.1 Z"/><path class="rel" d="M187.2,-34.7 C151.7,-80.5 249.3,-85.4 221.3,-42.7"/><path class="head" d="M217.5,-36.9 L219.2,-47.7 L226.8,-42.8 Z"/></g><g><g class="node" transform="translate(-205.5,7.4)"><circle r="42.8" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-15.6" dy="0.35em">Person</text><text class="props" y="1.3" dy="0.35em">email</text><text class="props" y="16.9" dy="0.35em">name</text></g><g class="node" transform="translate(1.6,-15.1)"><circle r="60.1" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-23.4" dy="0.35em">Commit</text><text class="props" y="-6.5" dy="0.35em">sha · subject</text><text class="props" y="9.1" dy="0.35em">authored_at</text><text class="props" y="24.7" dy="0.35em">files_changed</text></g><g class="node" transform="translate(204,7.6)"><circle r="45.5" fill="#F79767" stroke="#C17650"/><text class="label" y="-7.8" dy="0.35em">File</text><text class="props" y="9.1" dy="0.35em">path · name</text></g></g><g><g transform="translate(-111.1,-2.8) rotate(-6.2)"><text class="type" y="0" dy="0.35em">AUTHORED</text></g><g transform="translate(109.5,-3) rotate(6.4)"><text class="type" y="0" dy="0.35em">TOUCHED</text></g><g transform="translate(200.1,-91.8)"><text class="type" y="-7.1" dy="0.35em">CO_CHANGED</text><text class="rprops" y="7.8" dy="0.35em">count</text></g></g></svg>
