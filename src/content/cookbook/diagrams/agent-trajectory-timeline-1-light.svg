<svg id="d-agent-trajectory-timeline-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 507px;" viewBox="-270 -59 507 115" role="img" aria-labelledby="d-agent-trajectory-timeline-1-light-title d-agent-trajectory-timeline-1-light-desc"><title id="d-agent-trajectory-timeline-1-light-title">Data model: a session's steps, each calling one tool</title><desc id="d-agent-trajectory-timeline-1-light-desc">A Session links to each of its Step nodes by a STEP relationship that carries an integer timestamp, a sequence number and a token count. Each Step has a kind, text and time, and a CALLED relationship to the one Tool it used.</desc><style>#d-agent-trajectory-timeline-1-light{font-family:"Relate Sans",system-ui,sans-serif}#d-agent-trajectory-timeline-1-light text{text-anchor:middle}#d-agent-trajectory-timeline-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-agent-trajectory-timeline-1-light .dash{stroke-dasharray:6 4}#d-agent-trajectory-timeline-1-light .head{fill:#A5ABB6}#d-agent-trajectory-timeline-1-light .node circle{stroke-width:2}#d-agent-trajectory-timeline-1-light .label{font-size:14px;font-weight:600;fill:#0A1114}#d-agent-trajectory-timeline-1-light .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-agent-trajectory-timeline-1-light .type,#d-agent-trajectory-timeline-1-light .rprops{stroke:#F2F2F2;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-agent-trajectory-timeline-1-light .type{font-size:12px;font-weight:600;fill:#0A1114}#d-agent-trajectory-timeline-1-light .rprops{font-size:11px;font-weight:400;fill:#59656A}</style><g><path class="rel" d="M-175.3,0.7 C-124.7,-0.5 -74,-1.7 -23.4,-2.9"/><path class="head" d="M-16.4,-3.1 L-26.3,1.7 L-26.5,-7.3 Z"/><path class="rel" d="M68,-2.4 C94.6,-1.4 121.2,-0.3 147.8,0.8"/><path class="head" d="M154.8,1 L144.6,5.1 L144.9,-3.9 Z"/></g><g><g class="node" transform="translate(-216,1.6)"><circle r="40.7" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-7.8" dy="0.35em">Session</text><text class="props" y="9.1" dy="0.35em">id</text></g><g class="node" transform="translate(26.3,-4.1)"><circle r="41.7" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-15.6" dy="0.35em">Step</text><text class="props" y="1.3" dy="0.35em">id · kind</text><text class="props" y="16.9" dy="0.35em">text · at</text></g><g class="node" transform="translate(189.7,2.4)"><circle r="34" fill="#F79767" stroke="#C17650"/><text class="label" y="-7.8" dy="0.35em">Tool</text><text class="props" y="9.1" dy="0.35em">name</text></g></g><g><g transform="translate(-95.9,-1.2) rotate(-1.4)"><text class="type" y="0" dy="0.35em">STEP</text><text class="rprops" y="15" dy="0.35em">ts (integer) · seq · tokens</text></g><g transform="translate(111.4,-0.7) rotate(2.3)"><text class="type" y="0" dy="0.35em">CALLED</text></g></g></svg>
