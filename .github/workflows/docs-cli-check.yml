# Replays the CLI facts the docs state against the latest relate release
# (DOCS-PLAN.md §6 "docs:cli-check"): installs the release binary through
# public/install.sh, then runs `npm run docs:cli-check`, which replays every
# recorded run in src/content/docs/_data/ (engine.json, cli.json, errors.json:
# the --help pages, agent-context, messages, exit codes) and every
# ```bash verify fence on a docs page, and fails on any drift with a unified
# diff.
#
# Weekly, by hand, and on a push to main that touches the engine build the
# site ships (public/wasm), the docs pages or data files, or the check itself.
# It is not a required check: it depends on a published release, not on the
# pull request.
#
# install.sh resolves the latest release of relatedb/relate through the
# GitHub API. The repository is private before launch, so the install step
# reads it with RELATE_UPSTREAM_TOKEN (the token docs-samples.yml and
# engine-release.yml use); without that secret it falls back to the job's
# token, which can read the release only once the repository is public. A
# failure turns the run red: since relate 0.1.0 a release exists, so a red run
# is drift or a broken install, never "no release yet".
#
# A drift after a release: if the CLI changed on purpose, re-record the data
# files with `RELATE_BIN=<binary> npm run docs:cli-check -- --record`, fix the
# page text fences the diff names, bump _data/engine.json in the same change,
# and commit the reviewed diff.
name: Docs CLI check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/wasm/**'
      - 'src/content/docs/**'
      - 'scripts/docs-cli-check.ts'
      - 'src/lib/docs/checks/cli.ts'

permissions:
  contents: read

concurrency:
  group: docs-cli-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # install.sh verifies the SSHSIG signature on SHA256SUMS, the signed
      # release header and the binary's SHA-256 before it installs anything,
      # into ~/.local/bin. The token only raises the GitHub API rate limit.
      - name: Install the latest relate release
        env:
          GITHUB_TOKEN: ${{ secrets.RELATE_UPSTREAM_TOKEN || github.token }}
        run: |
          bash public/install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Replay the CLI facts
        env:
          DO_NOT_TRACK: '1'
        run: |
          relate --version
          RELATE_BIN="$HOME/.local/bin/relate" npm run docs:cli-check
