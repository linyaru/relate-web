# Checks the cookbook (src/content/cookbook) on every pull request and push
# to main: every recipe parses and validates, runs on the engine build the
# site ships (public/wasm), and reproduces its recorded results; the README
# index is current; the tooling's unit tests and the type checks (site and
# playground) pass; the site builds; and in headless Chrome on the built site
# every recipe runs, the playground loads, and every recipe opens in the
# playground. Needs no secrets and no other repository.
#
# The docs (src/content/docs) are checked from the source before the build
# (`docs:check`: frontmatter, links, words, the twins, the trust and diagram
# checks), their prose is linted with Vale (`docs:lint`), and after the build
# `docs:check -- --built` checks the built pages, twins and llms.txt.
#
# There is no paths filter, so the job always reports and can be a required
# status check on main. It takes well under a minute.
#
# A failure in "Check recipes" prints each recipe's recorded and actual
# result. If the engine changed on purpose (a public/wasm refresh), run
# `npm run cookbook:record` locally and commit the reviewed diff.
name: Cookbook

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cookbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: each docs page's "Updated" date is its file's last commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json

      - run: npm ci

      # The playground is its own package (playground/package.json).
      - name: Install playground
        run: npm ci --prefix playground

      - name: Unit tests
        run: |
          npm run cookbook:test
          npm run docs:test

      - name: Check decision records
        run: npm run adr:check

      - name: Check docs
        run: npm run docs:check

      # Vale for docs:lint, pinned and checked against the release's published SHA-256.
      - name: Install Vale
        env:
          VALE_VERSION: 3.25.1
          VALE_SHA256: 4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182
        run: |
          curl -sSfL -o "$RUNNER_TEMP/vale.tar.gz" "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  $RUNNER_TEMP/vale.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint docs prose
        run: npm run docs:lint

      - name: Check recipes
        run: npm run cookbook:check

      - name: Type check
        run: npm run check

      - name: Type check playground
        run: npm run check:playground

      - name: Build site
        run: npm run build

      - name: Check built docs
        run: npm run docs:check -- --built

      # In headless Chrome (preinstalled on the runner) on the built site:
      # every recipe's steps run, the page controls on one recipe, the
      # playground's sample data, and the cookbook -> playground hand-off.
      - name: Run the cookbook and playground in the browser
        run: npm run cookbook:browser
