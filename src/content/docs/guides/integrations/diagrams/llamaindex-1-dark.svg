<svg id="d-llamaindex-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 317px;" viewBox="-163 -163 317 279" role="img" aria-labelledby="d-llamaindex-1-dark-title d-llamaindex-1-dark-desc"><title id="d-llamaindex-1-dark-title">Data model: notes about the team's projects</title><desc id="d-llamaindex-1-dark-desc">A Note has an id, its text and an embedding, and is ABOUT one Project. A Person WORKS_ON a Project, so the retriever can add who works on the project each note is about. The vector index note_embedding covers the embedding property of every Note.</desc><style>#d-llamaindex-1-dark{font-family:"Relate Sans",system-ui,sans-serif}#d-llamaindex-1-dark text{text-anchor:middle}#d-llamaindex-1-dark .rel{fill:none;stroke:#80808A;stroke-width:2}#d-llamaindex-1-dark .dash{stroke-dasharray:6 4}#d-llamaindex-1-dark .head{fill:#80808A}#d-llamaindex-1-dark .node circle{stroke-width:2}#d-llamaindex-1-dark .label{font-size:14px;font-weight:600;fill:#0A1114}#d-llamaindex-1-dark .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-llamaindex-1-dark .type,#d-llamaindex-1-dark .rprops{stroke:#18181C;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-llamaindex-1-dark .type{font-size:12px;font-weight:600;fill:#F1F1F3}#d-llamaindex-1-dark .rprops{font-size:11px;font-weight:400;fill:#9B9BA3}</style><g><path class="rel" d="M33.4,-57.7 C46,-34.6 58.5,-11.5 71.1,11.5"/><path class="head" d="M74.4,17.7 L65.7,11.1 L73.6,6.8 Z"/><path class="rel" d="M-62.7,46 C-27.2,48.6 8.3,51.3 43.8,53.9"/><path class="head" d="M50.8,54.4 L40.5,58.1 L41.1,49.2 Z"/></g><g><g class="node" transform="translate(10,-100.5)"><circle r="48.8" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-15.6" dy="0.35em">Note</text><text class="props" y="1.3" dy="0.35em">id · text</text><text class="props" y="16.9" dy="0.35em">embedding</text></g><g class="node" transform="translate(96.3,57.7)"><circle r="44.6" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-15.6" dy="0.35em">Project</text><text class="props" y="1.3" dy="0.35em">name</text><text class="props" y="16.9" dy="0.35em">language</text></g><g class="node" transform="translate(-106.3,42.8)"><circle r="43.7" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-7.8" dy="0.35em">Person</text><text class="props" y="9.1" dy="0.35em">name · role</text></g></g><g><g transform="translate(53.9,-20) rotate(61.4)"><text class="type" y="0" dy="0.35em">ABOUT</text></g><g transform="translate(-6,50.2) rotate(4.2)"><text class="type" y="0" dy="0.35em">WORKS_ON</text></g></g></svg>
