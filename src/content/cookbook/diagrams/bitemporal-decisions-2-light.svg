never valid. On record time, d1 is believed until 1 February, d4 from then
on, and d6 only from 6 to 12 February.</desc><style>#d-bitemporal-decisions-2-light{font-family:"Public Sans",system-ui,sans-serif;font-size:14px;fill:#181414;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#d-bitemporal-decisions-2-light .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#d-bitemporal-decisions-2-light .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#d-bitemporal-decisions-2-light .error-icon{fill:#FCF9F6;}#d-bitemporal-decisions-2-light .error-text{fill:#030609;stroke:#030609;}#d-bitemporal-decisions-2-light .edge-thickness-normal{stroke-width:1px;}#d-bitemporal-decisions-2-light .edge-thickness-thick{stroke-width:3.5px;}#d-bitemporal-decisions-2-light .edge-pattern-solid{stroke-dasharray:0;}#d-bitemporal-decisions-2-light .edge-thickness-invisible{stroke-width:0;fill:none;}#d-bitemporal-decisions-2-light .edge-pattern-dashed{stroke-dasharray:3;}#d-bitemporal-decisions-2-light .edge-pattern-dotted{stroke-dasharray:2;}#d-bitemporal-decisions-2-light .marker{fill:#6B6A68;stroke:#6B6A68;}#d-bitemporal-decisions-2-light .marker.cross{stroke:#6B6A68;}#d-bitemporal-decisions-2-light svg{font-family:"Public Sans",system-ui,sans-serif;font-size:14px;}#d-bitemporal-decisions-2-light p{margin:0;}#d-bitemporal-decisions-2-light .mermaid-main-font{font-family:"Public Sans",system-ui,sans-serif;}#d-bitemporal-decisions-2-light .exclude-range{fill:#eeeeee;}#d-bitemporal-decisions-2-light .section{stroke:none;opacity:0.2;}#d-bitemporal-decisions-2-light .section0{fill:#F2EAD4;}#d-bitemporal-decisions-2-light .section2{fill:#F2EAD4;}#d-bitemporal-decisions-2-light .section1,#d-bitemporal-decisions-2-light .section3{fill:#FCF9F6;opacity:0.2;}#d-bitemporal-decisions-2-light .sectionTitle0{fill:#181414;}#d-bitemporal-decisions-2-light .sectionTitle1{fill