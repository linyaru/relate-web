<svg id="d-entity-resolution-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 680px;" viewBox="-312 -192 680 379" role="img" aria-labelledby="d-entity-resolution-1-light-title d-entity-resolution-1-light-desc"><title id="d-entity-resolution-1-light-title">Data model: records, the entities they resolve to, and the words and edges that match entities</title><desc id="d-entity-resolution-1-light-desc">Records from the CRM (Record:Crm) and from billing (Record:Billing) each RESOLVES_TO an Entity. An Entity HAS_TOKEN the words of its name, and tokens are SIMILAR to one another by a Dice score. Between two entities, CANDIDATE holds a scored pair with its domain and city matches, SAME_AS a scored match, and POSSIBLE_MATCH a doubtful pair with its reason.</desc><style>#d-entity-resolution-1-light{font-family:"Public Sans",system-ui,sans-serif}#d-entity-resolution-1-light text{text-anchor:middle}#d-entity-resolution-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-entity-resolution-1-light .dash{stroke-dasharray:6 4}#d-entity-resolution-1-light .head{fill:#A5ABB6}#d-entity-resolution-1-light .node circle{stroke-width:2}#d-entity-resolution-1-light .label{font-size:14px;font-weight:600;fill:#181414}#d-entity-resolution-1-light .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-entity-resolution-1-light .type,#d-entity-resolution-1-light .rprops{stroke:#FCF9F6;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-entity-resolution-1-light .type{font-size:12px;font-weight:600;fill:#181414}#d-entity-resolution-1-light .rprops{font-size:11px;font-weight:400;fill:#4F4E4D}</style><g><path class="rel" d="M-114.1,-65.9 C-87.5,-35.5 -60.8,-5.1 -34.2,25.3"/><path class="head" d="M-29.6,30.6 L-39.6,26 L-32.8,20.1 Z"/><path class="rel" d="M-171.7,98.7 C-132.1,91.9 -92.5,85 -52.9,78.2"/><path class="head" d="M-46,77 L-55.1,83.1 L-56.6,74.3 Z"/><path class="rel" d="M21.8,22.6 C35.1,-10.9 48.4,-44.5 61.7,-78"/><path class="head" d