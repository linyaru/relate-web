 y="235.3" dy="0.35em" text-anchor="start">Marshall Bookstore</text><circle class="miss" cx="225.3" cy="46.5" r="5.5"/><text class="other" x="236.3" y="46.5" dy="0.35em" text-anchor="start">Overton Bookstore</text><circle class="hit" cx="373.5" cy="208.9" r="7"/><text class="name" x="384.5" y="208.9" dy="0.35em" text-anchor="start">Powell's</text><circle class="hit" cx="429.3" cy="138.0" r="7"/><text class="name" x="440.3" y="138.0" dy="0.35em" text-anchor="start">Salmon Bookstore</text><circle class="miss" cx="168.5" cy="433.5" r="5.5"/><text class="other" x="179.5" y="433.5" dy="0.35em" text-anchor="start">Yamhill Bookstore</text><path class="bar" d="M12 466v-6M12 463h93.3M105.3 466v-6"/><text class="note" x="111.3" y="463" dy="0.35em">2 km</text></svg>
