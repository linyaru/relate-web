<svg id="d-migration-rehearsal-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 516px;" viewBox="-281 -155 516 383" role="img" aria-labelledby="d-migration-rehearsal-1-dark-title d-migration-rehearsal-1-dark-desc"><title id="d-migration-rehearsal-1-dark-title">Data model: the company directory; the migration renames HAS_CEO to LED_BY and adds industry</title><desc id="d-migration-rehearsal-1-dark-desc">An Organization is linked to its chief executive, a Person, by HAS_CEO, which the migration renames to LED_BY; the migration also adds an industry property to Organization. Each Organization has HAS_CATEGORY to an IndustryCategory and IN_CITY to a City, and each City is IN_COUNTRY a Country.</desc><style>#d-migration-rehearsal-1-dark{font-family:"Public Sans",system-ui,sans-serif}#d-migration-rehearsal-1-dark text{text-anchor:middle}#d-migration-rehearsal-1-dark .rel{fill:none;stroke:#6FB9C2;stroke-width:2}#d-migration-rehearsal-1-dark .dash{stroke-dasharray:6 4}#d-migration-rehearsal-1-dark .head{fill:#6FB9C2}#d-migration-rehearsal-1-dark .node circle{stroke-width:2}#d-migration-rehearsal-1-dark .label{font-size:14px;font-weight:600;fill:#181414}#d-migration-rehearsal-1-dark .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-migration-rehearsal-1-dark .type,#d-migration-rehearsal-1-dark .rprops{stroke:#014063;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-migration-rehearsal-1-dark .type{font-size:12px;font-weight:600;fill:#F2EAD4}#d-migration-rehearsal-1-dark .rprops{font-size:11px;font-weight:400;fill:#8FE3E8}</style><g><path class="rel" d="M-118.7,90.1 C-146.7,47.7 -174.7,5.2 -202.7,-37.2"/><path class="head" d="M-206.6,-43 L-197.3,-37.2 L-204.8,-32.2 Z"/><path class="rel" d="M-54.9,84.3 C-36.7,41.6 -18.5,-1.1 -0.3,-43.8"/><path class="head" d="M2.5,-50.2 L2.7,-39.2 L-5.6,-42.8 Z"/><path class="rel" d="M-15.1,133 C10.6,127.8 36.2,122.5 61.9,117.3"/><path class="head" d="M68.7,115.9 L59.8,122.3 L58,113.5 Z"/><path class="rel" d="M121.7,71.5 C135.7,34.9 149.6,-1.8 163.6,-38.4"/><path class="head" d="M166.1,-45 L166.7,-34 L158.3,-37.2 Z"/></g><g><g class="node" transform="translate(-81.4,146.6)"><circle r="67.7" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-31.2" dy="0.35em">Organization</text><text class="props" y="-14.3" dy="0.35em">id · name</text><text class="props" y="1.3" dy="0.35em">founded · employees</text><text class="props" y="16.9" dy="0.35em">isPublic · summary</text><text class="props" y="32.5" dy="0.35em">industry</text></g><g class="node" transform="translate(-228.6,-76.4)"><circle r="38.9" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-7.8" dy="0.35em">Person</text><text class="props" y="9.1" dy="0.35em">id · name</text></g><g class="node" transform="translate(21.3,-94.3)"><circle r="46.9" fill="#F79767" stroke="#C17650"/><text class="label" y="-16.9" dy="0.35em">Industry</text><text class="label" y="1.3" dy="0.35em">Category</text><text class="props" y="18.2" dy="0.35em">id · name</text></g><g class="node" transform="translate(107.9,107.9)"><circle r="38.9" fill="#56C7E4" stroke="#439BB2"/><text class="label" y="-7.8" dy="0.35em">City</text><text class="props" y="9.1" dy="0.35em">id · name</text></g><g class="node" transform="translate(180.9,-83.8)"><circle r="40.6" fill="#D8C7AE" stroke="#A89B88"/><text class="label" y="-7.8" dy="0.35em">Country</text><text class="props" y="9.1" dy="0.35em">id · name</text></g></g><g><g transform="translate(-162.6,23.5) rotate(56.6)"><text class="type" y="0" dy="0.35em">HAS_CEO → LED_BY</text></g><g transform="translate(-26.2,17.1) rotate(-66.9)"><text class="type" y="0" dy="0.35em">HAS_CATEGORY</text></g><g transform="translate(26.8,124.5) rotate(-11.6)"><text class="type" y="0" dy="0.35em">IN_CITY</text></g><g transform="translate(143.9,13.3) rotate(-69.2)"><text class="type" y="0" dy="0.35em">IN_COUNTRY</text></g></g></svg>
