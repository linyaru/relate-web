<svg id="d-query-the-relate-docs-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 633px;" viewBox="-313 -135 633 242" role="img" aria-labelledby="d-query-the-relate-docs-1-light-title d-query-the-relate-docs-1-light-desc"><title id="d-query-the-relate-docs-1-light-title">Data model: pages have sections and link to pages, and questions carry vectors</title><desc id="d-query-the-relate-docs-1-light-desc">A Page has an id, a title and a URL, links to other Pages, and HAS_SECTION relationships to its Sections. A Section has a heading, its text and a 384-float embedding. A Question stands alone, holding a question's text and its embedding.</desc><style>#d-query-the-relate-docs-1-light{font-family:"Relate Sans",system-ui,sans-serif}#d-query-the-relate-docs-1-light text{text-anchor:middle}#d-query-the-relate-docs-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-query-the-relate-docs-1-light .dash{stroke-dasharray:6 4}#d-query-the-relate-docs-1-light .head{fill:#A5ABB6}#d-query-the-relate-docs-1-light .node circle{stroke-width:2}#d-query-the-relate-docs-1-light .label{font-size:14px;font-weight:600;fill:#0A1114}#d-query-the-relate-docs-1-light .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-query-the-relate-docs-1-light .type,#d-query-the-relate-docs-1-light .rprops{stroke:#F2F2F2;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-query-the-relate-docs-1-light .type{font-size:12px;font-weight:600;fill:#0A1114}#d-query-the-relate-docs-1-light .rprops{font-size:11px;font-weight:400;fill:#59656A}</style><g><path class="rel" d="M31.5,-21.8 C68.8,-15 106,-8.3 143.3,-1.6"/><path class="head" d="M150.2,-0.4 L139.5,2.3 L141.1,-6.6 Z"/><path class="rel" d="M-21.6,-64.9 C-54.8,-112.5 43,-112.4 12.9,-71.2"/><path class="head" d="M8.8,-65.6 L11,-76.3 L18.3,-71 Z"/></g><g><g class="node" transform="translate(-7,-28.7)"><circle r="39.1" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-15.6" dy="0.35em">Page</text><text class="props" y="1.3" dy="0.35em">id · title</text><text class="props" y="16.9" dy="0.35em">url</text></g><g class="node" transform="translate(228.2,13.7)"><circle r="78.2" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-15.6" dy="0.35em">Section</text><text class="props" y="1.3" dy="0.35em">id · heading · text</text><text class="props" y="16.9" dy="0.35em">embedding (384 floats)</text></g><g class="node" transform="translate(-221.2,15)"><circle r="78.2" fill="#F79767" stroke="#C17650"/><text class="label" y="-15.6" dy="0.35em">Question</text><text class="props" y="1.3" dy="0.35em">text</text><text class="props" y="16.9" dy="0.35em">embedding (384 floats)</text></g></g><g><g transform="translate(90.8,-11.1) rotate(10.2)"><text class="type" y="0" dy="0.35em">HAS_SECTION</text></g><g transform="translate(-5.9,-112.8)"><text class="type" y="0" dy="0.35em">LINKS_TO</text></g></g></svg>
