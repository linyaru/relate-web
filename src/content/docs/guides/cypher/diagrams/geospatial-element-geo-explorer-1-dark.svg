<svg id="geo-explorer-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 640px;" viewBox="0 0 640 480" role="img" aria-labelledby="geo-explorer-1-dark-title geo-explorer-1-dark-desc"><title id="geo-explorer-1-dark-title">The places and the radius search, as recorded</title><desc id="geo-explorer-1-dark-desc">6 places on a plane, longitude across and latitude up, with the radius search's circle of 2000 m around latitude 45.5231, longitude -122.6765. Lit, with their names: Riverside Office, Bean There, Harbor Library and Ferry Cafe. Outside the circle: Eastside Cafe and Hilltop Roasters. Beyond the plane: to the north-east, North Library and Pier Cafe.</desc><style>#geo-explorer-1-dark{font-family:"Public Sans",system-ui,sans-serif}#geo-explorer-1-dark .plane{fill:#002B43;stroke:#4C99A4}#geo-explorer-1-dark .area{fill:#185A78;stroke:#8FE3E8;stroke-width:2;fill-opacity:0.7}#geo-explorer-1-dark .center,#geo-explorer-1-dark .bar{stroke:#8FE3E8;stroke-width:1.5;fill:none}#geo-explorer-1-dark .hit{fill:#8FE3E8;stroke:#F2EAD4;stroke-width:1.5}#geo-explorer-1-dark .miss{fill:#002B43;stroke:#8FE3E8;stroke-width:1.5}#geo-explorer-1-dark .name,#geo-explorer-1-dark .other{paint-order:stroke;stroke:#002B43;stroke-width:3px;stroke-linejoin:round}#geo-explorer-1-dark .name{font-size:13px;font-weight:600;fill:#F2EAD4}#geo-explorer-1-dark .other{font-size:12px;fill:#8FE3E8}#geo-explorer-1-dark .note{font-size:12px;fill:#8FE3E8}</style><rect class="plane" x="0.5" y="0.5" width="639" height="479" rx="6"/><circle class="area" cx="229.7" cy="225.6" r="152.6"/><path class="center" d="M223.7 225.6h12M229.7 219.6v12"/><circle class="hit" cx="215.4" cy="199.2" r="7"/><text class="name" x="226.4" y="199.2" dy="0.35em" text-anchor="start">Bean There</text><circle class="miss" cx="562.9" cy="290.1" r="5.5"/><text class="other" x="551.9" y="290.1" dy="0.35em" text-anchor="end">Eastside Cafe</text><circle class="hit" cx="335.6" cy="318.1" r="7"/><text class="name" x="346.6" y="318.1" dy="0.35em" text-anchor="start">Ferry Cafe</text><circle class="hit" cx="250.5" cy="260.4" r="7"/><text class="name" x="261.5" y="260.4" dy="0.35em" text-anchor="start">Harbor Library</text><circle class="miss" cx="83.4" cy="58.3" r="5.5"/><text class="other" x="94.4" y="58.3" dy="0.35em" text-anchor="start">Hilltop Roasters</text><circle class="hit" cx="229.7" cy="225.6" r="7"/><text class="name" x="240.7" y="225.6" dy="0.35em" text-anchor="start">Riverside Office</text><text class="note" x="630" y="18" text-anchor="end">2 more beyond the plane: to the north-east, North Library and Pier Cafe</text><path class="bar" d="M12 466v-6M12 463h76.3M88.3 466v-6"/><text class="note" x="94.3" y="463" dy="0.35em">1 km</text></svg>
