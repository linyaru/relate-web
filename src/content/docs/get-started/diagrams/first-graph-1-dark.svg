<svg id="d-first-graph-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 317px;" viewBox="-158 -112 317 171" role="img" aria-labelledby="d-first-graph-1-dark-title d-first-graph-1-dark-desc"><title id="d-first-graph-1-dark-title">Data model: people, the projects they work on or maintain, and who knows whom</title><desc id="d-first-graph-1-dark-desc">A Person WORKS_ON a Project, with the year it started as since, or MAINTAINS it. A Person KNOWS another Person. A Person has a name and a role; a Project has a name and a language.</desc><style>#d-first-graph-1-dark{font-family:"Public Sans",system-ui,sans-serif}#d-first-graph-1-dark text{text-anchor:middle}#d-first-graph-1-dark .rel{fill:none;stroke:#6FB9C2;stroke-width:2}#d-first-graph-1-dark .dash{stroke-dasharray:6 4}#d-first-graph-1-dark .head{fill:#6FB9C2}#d-first-graph-1-dark .node circle{stroke-width:2}#d-first-graph-1-dark .label{font-size:14px;font-weight:600;fill:#181414}#d-first-graph-1-dark .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-first-graph-1-dark .type,#d-first-graph-1-dark .rprops{stroke:#014063;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-first-graph-1-dark .type{font-size:12px;font-weight:600;fill:#F2EAD4}#d-first-graph-1-dark .rprops{font-size:11px;font-weight:400;fill:#8FE3E8}</style><g><path class="rel" d="M-60.5,-17.6 C-20.2,-35.1 17.4,-36.3 52.1,-21.2"/><path class="head" d="M58.6,-18.4 L47.6,-18.3 L51.2,-26.5 Z"/><path class="rel" d="M-60.5,17.6 C-20.2,35.1 17.4,36.3 52.1,21.2"/><path class="head" d="M58.6,18.4 L51.2,26.5 L47.6,18.3 Z"/><path class="rel" d="M-117.3,-40.8 C-152.7,-86.7 -55.1,-91.2 -83.2,-48.7"/><path class="head" d="M-87,-42.8 L-85.3,-53.6 L-77.7,-48.7 Z"/></g><g><g class="node" transform="translate(-100.8,0)"><circle r="44" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-7.8" dy="0.35em">Person</text><text class="props" y="9.1" dy="0.35em">name · role</text></g><g class="node" transform="translate(100.8,0)"><circle r="45.1" fill="#D8C7AE" stroke="#A89B88"/><text class="label" y="-15.6" dy="0.35em">Project</text><text class="props" y="1.3" dy="0.35em">name</text><text class="props" y="16.9" dy="0.35em">language</text></g></g><g><g transform="translate(-0.5,-30.9) rotate(-0.4)"><text class="type" y="0" dy="0.35em">WORKS_ON</text><text class="rprops" y="15" dy="0.35em">since</text></g><g transform="translate(-0.5,30.9) rotate(0.4)"><text class="type" y="0" dy="0.35em">MAINTAINS</text></g><g transform="translate(-103.9,-89.8)"><text class="type" y="0" dy="0.35em">KNOWS</text></g></g></svg>
