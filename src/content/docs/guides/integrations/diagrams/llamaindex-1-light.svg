<svg id="d-llamaindex-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 319px;" viewBox="-163 -163 319 278" role="img" aria-labelledby="d-llamaindex-1-light-title d-llamaindex-1-light-desc"><title id="d-llamaindex-1-light-title">Data model: notes about the team's projects</title><desc id="d-llamaindex-1-light-desc">A Note has an id, its text and an embedding, and is ABOUT one Project. A Person WORKS_ON a Project, so the retriever can add who works on the project each note is about. The vector index note_embedding covers the embedding property of every Note.</desc><style>#d-llamaindex-1-light{font-family:"Public Sans",system-ui,sans-serif}#d-llamaindex-1-light text{text-anchor:middle}#d-llamaindex-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-llamaindex-1-light .dash{stroke-dasharray:6 4}#d-llamaindex-1-light .head{fill:#A5ABB6}#d-llamaindex-1-light .node circle{stroke-width:2}#d-llamaindex-1-light .label{font-size:14px;font-weight:600;fill:#181414}#d-llamaindex-1-light .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-llamaindex-1-light .type,#d-llamaindex-1-light .rprops{stroke:#FCF9F6;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-llamaindex-1-light .type{font-size:12px;font-weight:600;fill:#181414}#d-llamaindex-1-light .rprops{font-size:11px;font-weight:400;fill:#4F4E4D}</style><g><path class="rel" d="M32.4,-58.3 C45.4,-35.4 58.3,-12.4 71.3,10.5"/><path class="head" d="M74.7,16.6 L65.9,10.1 L73.7,5.6 Z"/><path class="rel" d="M-61.8,46.9 C-26.4,49.1 9,51.2 44.4,53.4"/><path class="head" d="M51.4,53.8 L41.2,57.7 L41.7,48.7 Z"/></g><g><g class="node" transform="translate(8.3,-100.9)"><circle r="49" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-15.6" dy="0.35em">Note</text><text class="props" y="1.3" dy="0.35em">id · text</text><text class="props" y="16.9" dy="0.35em">embedding</text></g><g class="node" transform="translate(97.4,56.7)"><circle r="45.1" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-15.6" dy="0.35em">Project</text><text class="props" y="1.3" dy="0.35em">name</text><text class="props" y="16.9" dy="0.35em">language</text></g><g class="node" transform="translate(-105.7,44.2)"><circle r="44" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-7.8" dy="0.35em">Person</text><text class="props" y="9.1" dy="0.35em">name · role</text></g></g><g><g transform="translate(53.6,-20.9) rotate(60.5)"><text class="type" y="0" dy="0.35em">ABOUT</text></g><g transform="translate(-5.2,50.4) rotate(3.5)"><text class="type" y="0" dy="0.35em">WORKS_ON</text></g></g></svg>
