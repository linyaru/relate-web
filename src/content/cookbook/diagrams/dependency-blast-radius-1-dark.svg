<svg id="d-dependency-blast-radius-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 384px;" viewBox="-193 -195 384 329" role="img" aria-labelledby="d-dependency-blast-radius-1-dark-title d-dependency-blast-radius-1-dark-desc"><title id="d-dependency-blast-radius-1-dark-title">Data model: package versions, what they depend on, and the advisories that affect them</title><desc id="d-dependency-blast-radius-1-dark-desc">A root package version (Version:Root) DEPENDS_ON other Version nodes, which depend on further versions in turn; each DEPENDS_ON relationship records its version requirement. Any Version, the root included, can be AFFECTED_BY an Advisory, which has an id, a title and a CVSS 3 score.</desc><style>#d-dependency-blast-radius-1-dark{font-family:"Public Sans",system-ui,sans-serif}#d-dependency-blast-radius-1-dark text{text-anchor:middle}#d-dependency-blast-radius-1-dark .rel{fill:none;stroke:#6FB9C2;stroke-width:2}#d-dependency-blast-radius-1-dark .dash{stroke-dasharray:6 4}#d-dependency-blast-radius-1-dark .head{fill:#6FB9C2}#d-dependency-blast-radius-1-dark .node circle{stroke-width:2}#d-dependency-blast-radius-1-dark .label{font-size:14px;font-weight:600;fill:#181414}#d-dependency-blast-radius-1-dark .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-dependency-blast-radius-1-dark .type,#d-dependency-blast-radius-1-dark .rprops{stroke:#014063;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-dependency-blast-radius-1-dark .type{font-size:12px;font-weight:600;fill:#F2EAD4}#d-dependency-blast-radius-1-dark .rprops{font-size:11px;font-weight:400;fill:#8FE3E8}</style><g><path class="rel" d="M-88.2,9.9 C-66.8,-21.2 -45.3,-52.2 -23.8,-83.3"/><path class="head" d="M-19.8,-89 L-21.8,-78.3 L-29.2,-83.4 Z"/><path class="rel" d="M59.3,-131.4 C114.4,-149.7 86.5,-56 55.6,-96.6"/><path class="head" d="M51.3,-102.1 L61,-96.9 L53.8,-91.4 Z"/><path class="rel" d="M-63.3,61.6 C-23.1,64.3 17,67 57.2,69.7"/><path class="head" d="M64.2,70.1 L53.9,73.9 L54.5,65 Z"/><path class="rel" d="M31.8,-86.3 C50.3,-49.5 68.8,-12.7 87.4,24.1"/><path class="head" d="M90.5,30.4 L82,23.5 L90,19.4 Z"/></g><g><g class="node" transform="translate(-121.3,57.8)"><circle r="58.2" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-15.6" dy="0.35em">Version:Root</text><text class="props" y="1.3" dy="0.35em">key · system</text><text class="props" y="16.9" dy="0.35em">name · version</text></g><g class="node" transform="translate(9.2,-131.1)"><circle r="50.1" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-23.4" dy="0.35em">Version</text><text class="props" y="-6.5" dy="0.35em">key · system</text><text class="props" y="9.1" dy="0.35em">name</text><text class="props" y="24.7" dy="0.35em">version</text></g><g class="node" transform="translate(112.1,73.3)"><circle r="47" fill="#F16767" stroke="#BC5050"/><text class="label" y="-15.6" dy="0.35em">Advisory</text><text class="props" y="1.3" dy="0.35em">id · title</text><text class="props" y="16.9" dy="0.35em">cvss3</text></g></g><g><g transform="translate(-54,-39.6) rotate(-55.3)"><text class="type" y="0" dy="0.35em">DEPENDS_ON</text><text class="rprops" y="15" dy="0.35em">requirement</text></g><g transform="translate(134.6,-92.3)"><text class="type" y="-7.1" dy="0.35em">DEPENDS_ON</text><text class="rprops" y="7.8" dy="0.35em">requirement</text></g><g transform="translate(0.4,65.9) rotate(3.8)"><text class="type" y="0" dy="0.35em">AFFECTED_BY</text></g><g transform="translate(61.1,-28) rotate(63.3)"><text class="type" y="0" dy="0.35em">AFFECTED_BY</text></g></g></svg>
