<svg id="d-git-to-graph-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 524px;" viewBox="-262 -120 524 187" role="img" aria-labelledby="d-git-to-graph-1-light-title d-git-to-graph-1-light-desc"><title id="d-git-to-graph-1-light-title">Data model: people author commits, commits touch files, files change together</title><desc id="d-git-to-graph-1-light-desc">A Person AUTHORED each Commit they wrote, and a Commit TOUCHED every File it changed. Two files that changed in the same commits are joined by CO_CHANGED, whose count is the number of those commits.</desc><style>#d-git-to-graph-1-light{font-family:"Relate Sans",system-ui,sans-serif}#d-git-to-graph-1-light text{text-anchor:middle}#d-git-to-graph-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-git-to-graph-1-light .dash{stroke-dasharray:6 4}#d-git-to-graph-1-light .head{fill:#A5ABB6}#d-git-to-graph-1-light .node circle{stroke-width:2}#d-git-to-graph-1-light .label{font-size:14px;font-weight:600;fill:#0A1114}#d-git-to-graph-1-light .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-git-to-graph-1-light .type,#d-git-to-graph-1-light .rprops{stroke:#F2F2F2;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-git-to-graph-1-light .type{font-size:12px;font-weight:600;fill:#0A1114}#d-git-to-graph-1-light .rprops{font-size:11px;font-weight:400;fill:#59656A}</style><g><path class="rel" d="M-161.7,2.8 C-129.8,-0.8 -97.9,-4.3 -65.9,-7.8"/><path class="head" d="M-59,-8.6 L-68.4,-3 L-69.4,-12 Z"/><path class="rel" d="M61.3,-8.5 C90.9,-5.1 120.5,-1.7 150.1,1.7"/><path class="head" d="M157,2.5 L146.6,5.8 L147.6,-3.1 Z"/><path class="rel" d="M187.2,-34.8 C152.3,-81.2 250,-84.5 221.4,-42.3"/><path class="head" d="M217.5,-36.5 L219.3,-47.3 L226.8,-42.3 Z"/></g><g><g class="node" transform="translate(-204.9,7.6)"><circle r="43.4" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-15.6" dy="0.35em">Person</text><text class="props" y="1.3" dy="0.35em">email</text><text class="props" y="16.9" dy="0.35em">name</text></g><g class="node" transform="translate(1.7,-15.3)"><circle r="60" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-23.4" dy="0.35em">Commit</text><text class="props" y="-6.5" dy="0.35em">sha · subject</text><text class="props" y="9.1" dy="0.35em">authored_at</text><text class="props" y="24.7" dy="0.35em">files_changed</text></g><g class="node" transform="translate(203.2,7.7)"><circle r="45.5" fill="#F79767" stroke="#C17650"/><text class="label" y="-7.8" dy="0.35em">File</text><text class="props" y="9.1" dy="0.35em">path · name</text></g></g><g><g transform="translate(-110.4,-2.9) rotate(-6.3)"><text class="type" y="0" dy="0.35em">AUTHORED</text></g><g transform="translate(109.2,-3) rotate(6.5)"><text class="type" y="0" dy="0.35em">TOUCHED</text></g><g transform="translate(201,-91)"><text class="type" y="-7.1" dy="0.35em">CO_CHANGED</text><text class="rprops" y="7.8" dy="0.35em">count</text></g></g></svg>
