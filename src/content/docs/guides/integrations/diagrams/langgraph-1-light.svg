<svg id="d-langgraph-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 514px;" viewBox="-238 -157 514 314" role="img" aria-labelledby="d-langgraph-1-light-title d-langgraph-1-light-desc"><title id="d-langgraph-1-light-title">Data model: episodes attach to the team graph</title><desc id="d-langgraph-1-light-desc">Each Episode is IN_CONVERSATION of one Conversation, keyed by the LangGraph thread id. An Episode MENTIONS the Person and Project nodes it names. The team graph's WORKS_ON relationships connect people to projects, so recall can add what no episode said.</desc><style>#d-langgraph-1-light{font-family:"Public Sans",system-ui,sans-serif}#d-langgraph-1-light text{text-anchor:middle}#d-langgraph-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-langgraph-1-light .dash{stroke-dasharray:6 4}#d-langgraph-1-light .head{fill:#A5ABB6}#d-langgraph-1-light .node circle{stroke-width:2}#d-langgraph-1-light .label{font-size:14px;font-weight:600;fill:#181414}#d-langgraph-1-light .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-langgraph-1-light .type,#d-langgraph-1-light .rprops{stroke:#FCF9F6;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-langgraph-1-light .type{font-size:12px;font-weight:600;fill:#181414}#d-langgraph-1-light .rprops{font-size:11px;font-weight:400;fill:#4F4E4D}</style><g><path class="rel" d="M13.6,-87.1 C58.6,-67.5 103.6,-48 148.5,-28.5"/><path class="head" d="M155,-25.7 L144,-25.6 L147.6,-33.8 Z"/><path class="rel" d="M-56.2,-79.9 C-83.5,-60.6 -110.8,-41.3 -138.1,-22"/><path class="head" d="M-143.9,-18 L-138.3,-27.4 L-133.1,-20 Z"/><path class="rel" d="M-19.3,-63 C-15.7,-26.9 -12.1,9.3 -8.5,45.4"/><path class="head" d="M-7.8,52.4 L-13.3,42.9 L-4.3,42 Z"/><path class="rel" d="M-141.4,27.9 C-111.1,43.3 -80.8,58.7 -50.5,74.1"/><path class="head" d="M-44.3,77.3 L-55.2,76.8 L-51.1,68.8 Z"/></g><g><g class="node" transform="translate(-23.3,-103.1)"><circle r="40.2" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-7.8" dy="0.35em">Episode</text><text class="props" y="9.1" dy="0.35em">seq · text</text></g><g class="node" transform="translate(207.1,-3.1)"><circle r="55.9" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-7.8" dy="0.35em">Conversation</text><text class="props" y="9.1" dy="0.35em">id</text></g><g class="node" transform="translate(-180.6,8)"><circle r="44" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-7.8" dy="0.35em">Person</text><text class="props" y="9.1" dy="0.35em">name · role</text></g><g class="node" transform="translate(-3.2,98.2)"><circle r="45.1" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-15.6" dy="0.35em">Project</text><text class="props" y="1.3" dy="0.35em">name</text><text class="props" y="16.9" dy="0.35em">language</text></g></g><g><g transform="translate(84.3,-56.4) rotate(23.4)"><text class="type" y="0" dy="0.35em">IN_CONVERSATION</text></g><g transform="translate(-100,-48.9) rotate(-35.2)"><text class="type" y="0" dy="0.35em">MENTIONS</text></g><g transform="translate(-13.6,-5.3) rotate(84.3)"><text class="type" y="0" dy="0.35em">MENTIONS</text></g><g transform="translate(-92.8,52.6) rotate(27)"><text class="type" y="0" dy="0.35em">WORKS_ON</text></g></g></svg>
