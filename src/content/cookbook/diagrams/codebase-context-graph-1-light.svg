<svg id="d-codebase-context-graph-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 481px;" viewBox="-232 -179 481 364" role="img" aria-labelledby="d-codebase-context-graph-1-light-title d-codebase-context-graph-1-light-desc"><title id="d-codebase-context-graph-1-light-title">Data model: crates, documents and their sections, and the links between them</title><desc id="d-codebase-context-graph-1-light-desc">Crate nodes DEPENDS_ON other crates and CITES ADR documents (Doc:ADR). Each ADR HAS_CHUNK sections; a Chunk MENTIONS crates and CITES ADRs, and an ADR SUPERSEDES an earlier one, sometimes only in part. A Question is linked by dashed, derived ANCHOR relationships to the ADRs and crates it starts from.</desc><style>#d-codebase-context-graph-1-light{font-family:"Relate Sans",system-ui,sans-serif}#d-codebase-context-graph-1-light text{text-anchor:middle}#d-codebase-context-graph-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-codebase-context-graph-1-light .dash{stroke-dasharray:6 4}#d-codebase-context-graph-1-light .head{fill:#A5ABB6}#d-codebase-context-graph-1-light .node circle{stroke-width:2}#d-codebase-context-graph-1-light .label{font-size:14px;font-weight:600;fill:#0A1114}#d-codebase-context-graph-1-light .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-codebase-context-graph-1-light .type,#d-codebase-context-graph-1-light .rprops{stroke:#F2F2F2;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-codebase-context-graph-1-light .type{font-size:12px;font-weight:600;fill:#0A1114}#d-codebase-context-graph-1-light .rprops{font-size:11px;font-weight:400;fill:#59656A}</style><g><path class="rel dash" d="M-138,-14.4 C-113.4,-31.4 -88.9,-48.3 -64.4,-65.3"/><path class="head" d="M-58.7,-69.2 L-64.3,-59.8 L-69.5,-67.2 Z"/><path class="rel dash" d="M-133.9,28.5 C-106.8,40.6 -79.6,52.6 -52.5,64.6"/><path class="head" d="M-46.1,67.4 L-57.1,67.5 L-53.4,59.3 Z"/><path class="rel" d="M48.4,-88.6 C84.7,-79.2 116.8,