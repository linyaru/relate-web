<svg id="d-model-agent-memory-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 361px;" viewBox="-177 -144 361 370" role="img" aria-labelledby="d-model-agent-memory-1-light-title d-model-agent-memory-1-light-desc"><title id="d-model-agent-memory-1-light-title">Data model: entities, the episodes that mention them, and facts with their evidence</title><desc id="d-model-agent-memory-1-light-desc">An Episode MENTIONS the Entity nodes it names. A Fact is ABOUT one or more entities and comes FROM the Episode that is its evidence. A Fact carries valid time and record time, and a newer Fact SUPERSEDES the one it replaced in the same slot.</desc><style>#d-model-agent-memory-1-light{font-family:"Relate Sans",system-ui,sans-serif}#d-model-agent-memory-1-light text{text-anchor:middle}#d-model-agent-memory-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-model-agent-memory-1-light .dash{stroke-dasharray:6 4}#d-model-agent-memory-1-light .head{fill:#A5ABB6}#d-model-agent-memory-1-light .node circle{stroke-width:2}#d-model-agent-memory-1-light .label{font-size:14px;font-weight:600;fill:#0A1114}#d-model-agent-memory-1-light .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-model-agent-memory-1-light .type,#d-model-agent-memory-1-light .rprops{stroke:#F2F2F2;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-model-agent-memory-1-light .type{font-size:12px;font-weight:600;fill:#0A1114}#d-model-agent-memory-1-light .rprops{font-size:11px;font-weight:400;fill:#59656A}</style><g><path class="rel" d="M-64.3,-34.8 C-35.3,-46 -6.3,-57.1 22.7,-68.3"/><path class="head" d="M29.2,-70.9 L21.5,-63.1 L18.3,-71.5 Z"/><path class="rel" d="M51.2,40.3 C55,14.8 58.9,-10.7 62.8,-36.2"/><path class="head" d="M63.8,-43.1 L66.8,-32.5 L57.9,-33.9 Z"/><path class="rel" d="M-8.5,64.2 C-27.4,49.5 -46.3,34.8 -65.3,20.1"/><path class="head" d="M-70.8,15.8 L-60.1,18.4 L-65.6,25.5 Z"/><path class="rel" d="M93.5,139.7 C149.9,153.1 77,218 72,167.3"/><