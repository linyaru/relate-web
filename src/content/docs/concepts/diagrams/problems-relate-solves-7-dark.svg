<svg id="d-problems-relate-solves-7-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 289px;" viewBox="-152 -62 289 132" role="img" aria-labelledby="d-problems-relate-solves-7-dark-title d-problems-relate-solves-7-dark-desc"><title id="d-problems-relate-solves-7-dark-title">Recommended data model for hybrid retrieval: notes about topics, some of which record a decision</title><desc id="d-problems-relate-solves-7-dark-desc">A Note has text, a timestamp and an embedding, and is ABOUT a Topic. A Note that records a decision also has a DECIDED relationship to the Topic, carrying the decision's text and timestamp.</desc><style>#d-problems-relate-solves-7-dark{font-family:"Public Sans",system-ui,sans-serif}#d-problems-relate-solves-7-dark text{text-anchor:middle}#d-problems-relate-solves-7-dark .rel{fill:none;stroke:#6FB9C2;stroke-width:2}#d-problems-relate-solves-7-dark .dash{stroke-dasharray:6 4}#d-problems-relate-solves-7-dark .head{fill:#6FB9C2}#d-problems-relate-solves-7-dark .node circle{stroke-width:2}#d-problems-relate-solves-7-dark .label{font-size:14px;font-weight:600;fill:#181414}#d-problems-relate-solves-7-dark .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-problems-relate-solves-7-dark .type,#d-problems-relate-solves-7-dark .rprops{stroke:#014063;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-problems-relate-solves-7-dark .type{font-size:12px;font-weight:600;fill:#F2EAD4}#d-problems-relate-solves-7-dark .rprops{font-size:11px;font-weight:400;fill:#8FE3E8}</style><g><path class="rel" d="M-45.4,-21.6 C-15.1,-36.5 17.2,-35.4 51.7,-18.5"/><path class="head" d="M58,-15.4 L47,-15.8 L51,-23.9 Z"/><path class="rel" d="M-45.4,21.6 C-15.1,36.5 17.2,35.4 51.7,18.5"/><path class="head" d="M58,15.4 L51,23.9 L47,15.8 Z"/></g><g><g class="node" transform="translate(-89.4,0)"><circle r="49" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-15.6" dy="0.35em">Note</text><text class="props" y="1.3" dy="0.35em">id · text · ts</text><text class="props" y="16.9" dy="0.35em">embedding</text></g><g class="node" transform="translate(89.4,0)"><circle r="34" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-7.8" dy="0.35em">Topic</text><text class="props" y="9.1" dy="0.35em">name</text></g></g><g><g transform="translate(3.1,-31.2) rotate(3.4)"><text class="type" y="0" dy="0.35em">ABOUT</text></g><g transform="translate(3.1,31.2) rotate(-3.4)"><text class="type" y="0" dy="0.35em">DECIDED</text><text class="rprops" y="15" dy="0.35em">text · ts</text></g></g></svg>
