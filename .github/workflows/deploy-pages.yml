# Publishes the static site to GitHub Pages at https://r31473.relatedb.ai/ (unlisted preview host,
# CNAME -> relatedb.github.io).
# Interim host: switch to relatedb.ai / a scalable host later (see LAUNCH.md).
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full history: each docs page's "Updated" date is its file's last commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json

      - run: npm ci

      # The playground is its own package; `npm run build` builds it into dist/playground.
      - run: npm ci --prefix playground

      # Never deploy a cookbook whose recipes drift from their recordings.
      - name: Check cookbook
        run: npm run cookbook:check

      # Never deploy docs that fail their checks (scripts/docs.ts).
      - name: Check docs
        run: npm run docs:check

      - name: Build site
        run: npm run build

      - name: Check built docs
        run: npm run docs:check -- --built

      - name: Sanity check
        run: |
          test -s dist/index.html
          test -s dist/wasm/relate_bg.wasm
          test -s dist/wasm/relate.js
          test -s dist/playground/index.html
          test -s dist/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
