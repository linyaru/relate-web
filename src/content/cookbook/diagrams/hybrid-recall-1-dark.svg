<svg id="d-hybrid-recall-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 345px;" viewBox="-195 -92 345 184" role="img" aria-labelledby="d-hybrid-recall-1-dark-title d-hybrid-recall-1-dark-desc"><title id="d-hybrid-recall-1-dark-title">Data model: notes about topics, some of which record a decision</title><desc id="d-hybrid-recall-1-dark-desc">A Note has an id, text, a session, a timestamp and a 384-float embedding, and is ABOUT a Topic. A Note that records a decision also has a DECIDED relationship to the Topic, carrying the decision's text and timestamp.</desc><style>#d-hybrid-recall-1-dark{font-family:"Relate Sans",system-ui,sans-serif}#d-hybrid-recall-1-dark text{text-anchor:middle}#d-hybrid-recall-1-dark .rel{fill:none;stroke:#80808A;stroke-width:2}#d-hybrid-recall-1-dark .dash{stroke-dasharray:6 4}#d-hybrid-recall-1-dark .head{fill:#80808A}#d-hybrid-recall-1-dark .node circle{stroke-width:2}#d-hybrid-recall-1-dark .label{font-size:14px;font-weight:600;fill:#0A1114}#d-hybrid-recall-1-dark .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-hybrid-recall-1-dark .type,#d-hybrid-recall-1-dark .rprops{stroke:#18181C;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-hybrid-recall-1-dark .type{font-size:12px;font-weight:600;fill:#F1F1F3}#d-hybrid-recall-1-dark .rprops{font-size:11px;font-weight:400;fill:#9B9BA3}</style><g><path class="rel" d="M-30.9,-30.7 C-10.3,-39.5 21.4,-34.8 64.1,-16.5"/><path class="head" d="M70.5,-13.8 L59.6,-13.6 L63.1,-21.9 Z"/><path class="rel" d="M-30.9,30.7 C-10.3,39.5 21.4,34.8 64.1,16.5"/><path class="head" d="M70.5,13.8 L63.1,21.9 L59.6,13.6 Z"/></g><g><g class="node" transform="translate(-102.8,0)"><circle r="78.2" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-15.6" dy="0.35em">Note</text><text class="props" y="1.3" dy="0.35em">id · text · session · ts</text><text class="props" y="16.9" dy="0.35em">embedding (384 floats)</text></g><g class="node" transform="translate(102.8,0)"><circle r="34.1" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-7.8" dy="0.35em">Topic</text><text class="props" y="9.1" dy="0.35em">name</text></g></g><g><g transform="translate(9.9,-33.1) rotate(9.5)"><text class="type" y="0" dy="0.35em">ABOUT</text></g><g transform="translate(9.9,33.1) rotate(-9.5)"><text class="type" y="0" dy="0.35em">DECIDED</text><text class="rprops" y="15" dy="0.35em">text · ts</text></g></g></svg>
