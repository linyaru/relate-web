<svg id="d-problems-relate-solves-5-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 478px;" viewBox="-247 -99 478 205" role="img" aria-labelledby="d-problems-relate-solves-5-light-title d-problems-relate-solves-5-light-desc"><title id="d-problems-relate-solves-5-light-title">Recommended data model for bi-temporal facts: decisions about entities, the decisions they replace, and reviews</title><desc id="d-problems-relate-solves-5-light-desc">A Decision is ABOUT an Entity and carries two time ranges: validFrom and validTo for when it held, recordedAt and closedAt for when it was believed. A Decision SUPERSEDES the one it replaces, and a Review REJECTS a Decision.</desc><style>#d-problems-relate-solves-5-light{font-family:"Relate Sans",system-ui,sans-serif}#d-problems-relate-solves-5-light text{text-anchor:middle}#d-problems-relate-solves-5-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-problems-relate-solves-5-light .dash{stroke-dasharray:6 4}#d-problems-relate-solves-5-light .head{fill:#A5ABB6}#d-problems-relate-solves-5-light .node circle{stroke-width:2}#d-problems-relate-solves-5-light .label{font-size:14px;font-weight:600;fill:#0A1114}#d-problems-relate-solves-5-light .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-problems-relate-solves-5-light .type,#d-problems-relate-solves-5-light .rprops{stroke:#F2F2F2;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-problems-relate-solves-5-light .type{font-size:12px;font-weight:600;fill:#0A1114}#d-problems-relate-solves-5-light .rprops{font-size:11px;font-weight:400;fill:#59656A}</style><g><path class="rel" d="M66.3,14.9 C91,8.3 115.7,1.6 140.4,-5"/><path class="head" d="M147.1,-6.8 L138.7,0.1 L136.3,-8.6 Z"/><path class="rel" d="M-8.2,-28.8 C-41.9,-76 55.7,-77 26.1,-35.5"/><path class="head" d="M22,-29.8 L24.2,-40.5 L31.5,-35.3 Z"/><path class="rel" d="M-146.2,-4.6 C-117.8,2 -89.4,8.6 -61,15.2"/><path class="head" d="M-54.1,16.8 L-64.9,18.9 L-62.9,10.1 Z"/></g><g><g class="node" transform="translate(6.8,30.9)"><circle r="61.6" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-31.2" dy="0.35em">Decision</text><text class="props" y="-14.3" dy="0.35em">id · text</text><text class="props" y="1.3" dy="0.35em">validFrom · validTo</text><text class="props" y="16.9" dy="0.35em">recordedAt</text><text class="props" y="32.5" dy="0.35em">closedAt</text></g><g class="node" transform="translate(182.4,-16.3)"><circle r="35.5" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-7.8" dy="0.35em">Entity</text><text class="props" y="9.1" dy="0.35em">name</text></g><g class="node" transform="translate(-189.2,-14.6)"><circle r="44.1" fill="#F79767" stroke="#C17650"/><text class="label" y="-15.6" dy="0.35em">Review</text><text class="props" y="1.3" dy="0.35em">by · at</text><text class="props" y="16.9" dy="0.35em">reason</text></g></g><g><g transform="translate(106.7,4) rotate(-15.1)"><text class="type" y="0" dy="0.35em">ABOUT</text></g><g transform="translate(6.9,-76.5)"><text class="type" y="0" dy="0.35em">SUPERSEDES</text></g><g transform="translate(-100.2,6.1) rotate(13.1)"><text class="type" y="0" dy="0.35em">REJECTS</text></g></g></svg>
