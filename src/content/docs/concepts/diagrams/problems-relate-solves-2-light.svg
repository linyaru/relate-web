<svg id="d-problems-relate-solves-2-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 371px;" viewBox="-205 -137 371 326" role="img" aria-labelledby="d-problems-relate-solves-2-light-title d-problems-relate-solves-2-light-desc"><title id="d-problems-relate-solves-2-light-title">Recommended data model for agent memory: entities, the episodes that mention them, and facts with their evidence</title><desc id="d-problems-relate-solves-2-light-desc">An Episode MENTIONS the Entity nodes it names. A Fact is ABOUT one or more entities and comes FROM the Episode that is its evidence. A newer Fact SUPERSEDES the one it replaced in the same slot, so a correction keeps the history.</desc><style>#d-problems-relate-solves-2-light{font-family:"Public Sans",system-ui,sans-serif}#d-problems-relate-solves-2-light text{text-anchor:middle}#d-problems-relate-solves-2-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-problems-relate-solves-2-light .dash{stroke-dasharray:6 4}#d-problems-relate-solves-2-light .head{fill:#A5ABB6}#d-problems-relate-solves-2-light .node circle{stroke-width:2}#d-problems-relate-solves-2-light .label{font-size:14px;font-weight:600;fill:#181414}#d-problems-relate-solves-2-light .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-problems-relate-solves-2-light .type,#d-problems-relate-solves-2-light .rprops{stroke:#FCF9F6;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-problems-relate-solves-2-light .type{font-size:12px;font-weight:600;fill:#181414}#d-problems-relate-solves-2-light .rprops{font-size:11px;font-weight:400;fill:#4F4E4D}</style><g><path class="rel" d="M-30.3,-64.6 C0,-54.9 30.3,-45.3 60.6,-35.6"/><path class="head" d="M67.2,-33.5 L56.3,-32.2 L59.1,-40.8 Z"/><path class="rel" d="M7.5,62.9 C28.2,46 48.9,29.1 69.6,12.2"/><path class="head" d="M75.1,7.8 L70.1,17.6 L64.5,10.7 Z"/><path class="rel" d="M-47.6,43.4 C-52.5,20.1 -57.4,-3.1 -62.3,-26.4"/><path class="head" d="M-63.7,-33.2 L-57.3,-24.4 L