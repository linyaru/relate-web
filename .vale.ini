# Vale (https://vale.sh) on the docs prose: the Google developer style, the
# relate vocabulary, and the overrides where the docs style guide
# (src/content/docs/STYLE.md, DOCS-PLAN.md §4) differs from Google's.
#
#   npm run docs:lint    regenerates the vocabulary, then runs Vale on every
#                        docs page, the glossary and STYLE.md (needs `vale`;
#                        it prints how to install it when missing)
#
# Layout (scripts/vale/):
#   styles/Google/                              fetched by `vale sync` from the pinned
#                                               release below; not committed
#   styles/config/vocabularies/relate/accept.txt  generated from _glossary/*.mdx by
#                                               `node scripts/docs.ts --vocab`; committed,
#                                               and docs:check fails when it is stale
#
# Vale skips fenced code and inline code in markdown, but lints front-matter
# string values (Vale 3.25.1), so docs:lint hands it the glossary's term files
# with their frontmatter blanked out, line for line (scripts/docs.ts lint()). The
# mechanical rules of STYLE.md §4.10 (banned words, synonyms, headings,
# exclamation marks, links) are enforced by docs:check (scripts/docs.ts);
# Vale adds Google's grammar and usage rules on top. CI fails on Vale errors
# only; warnings are advice for the author and the reviewer.

StylesPath = scripts/vale/styles
MinAlertLevel = warning
Vocab = relate
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip

# The docs pages are MDX; Vale reads them as markdown (directives, JSX
# components and {/* comments */} are left to docs:check).
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Google
# Code identifiers and invented example names are not words; docs:check and
# the vocabulary handle the names that matter.
Vale.Spelling = NO
# Error messages and JSON keys are quoted character for character (STYLE.md §4.6).
Google.Quotes = NO
# STYLE.md §4.4 allows one exclamation mark at the end of a tutorial; docs:check enforces it.
Google.Exclamation = NO
Google.EmDash = warning
# Directive attributes ({key=python}) and MDX comments are markup, not prose;
# "Neo4j Desktop Relate" is another product's name, quoted on where-relate-fits.
TokenIgnores = (\]\{[^}\n]*\}), (\{/\*.*?\*/\}), (Neo4j Desktop Relate)
# A JSX component on its own line (<Install />) is markup.
BlockIgnores = (?m)^<[A-Z][A-Za-z]*\b[^>]*/>$

# Tutorials say "we" and "let's" (STYLE.md §4.3).
[**/get-started/**/*.mdx]
Google.We = NO

# The style guide quotes the words it bans.
[**/STYLE.md]
# It also quotes the spellings the vocabulary rejects ("Relate", "cypher", "Wasm").
Vale.Terms = NO
Google.Latin = NO
Google.WordList = NO
Google.Ellipses = NO
Google.EmDash = NO
