<svg id="d-bitemporal-decisions-2-light" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 272" style="max-width: 784px;" role="graphics-document document" aria-roledescription="gantt" aria-describedby="chart-desc-d-bitemporal-decisions-2-light" aria-labelledby="chart-title-d-bitemporal-decisions-2-light"><title id="chart-title-d-bitemporal-decisions-2-light">The orders decisions on both time axes</title><desc id="chart-desc-d-bitemporal-decisions-2-light">The chart has a valid-time row and a record-time row for the orders
decisions. On valid time, d1 (postgres) holds from 1 to 10 January 2024
