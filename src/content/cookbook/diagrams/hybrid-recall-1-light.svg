<svg id="d-hybrid-recall-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 347px;" viewBox="-196 -93 347 186" role="img" aria-labelledby="d-hybrid-recall-1-light-title d-hybrid-recall-1-light-desc"><title id="d-hybrid-recall-1-light-title">Data model: notes about topics, some of which record a decision</title><desc id="d-hybrid-recall-1-light-desc">A Note has an id, text, a session, a timestamp and a 384-float embedding, and is ABOUT a Topic. A Note that records a decision also has a DECIDED relationship to the Topic, carrying the decision's text and timestamp.</desc><style>#d-hybrid-recall-1-light{font-family:"Public Sans",system-ui,sans-serif}#d-hybrid-recall-1-light text{text-anchor:middle}#d-hybrid-recall-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-hybrid-recall-1-light .dash{stroke-dasharray:6 4}#d-hybrid-recall-1-light .head{fill:#A5ABB6}#d-hybrid-recall-1-light .node circle{stroke-width:2}#d-hybrid-recall-1-light .label{font-size:14px;font-weight:600;fill:#181414}#d-hybrid-recall-1-light .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-hybrid-recall-1-light .type,#d-hybrid-recall-1-light .rprops{stroke:#FCF9F6;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-hybrid-recall-1-light .type{font-size:12px;font-weight:600;fill:#181414}#d-hybrid-recall-1-light .rprops{font-size:11px;font-weight:400;fill:#4F4E4D}</style><g><path class="rel" d="M-30.4,-31 C-10.1,-39.6 21.5,-34.7 64.6,-16.4"/><path class="head" d="M71.1,-13.7 L60.1,-13.5 L63.6,-21.7 Z"/><path class="rel" d="M-30.4,31 C-10.1,39.6 21.5,34.7 64.6,16.4"/><path class="head" d="M71.1,13.7 L63.6,21.7 L60.1,13.5 Z"/></g><g><g class="node" transform="translate(-103.3,0)"><circle r="79.2" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-15.6" dy="0.35em">Note</text><text class="props" y="1.3" dy="0.35em">id · text · session · ts</text><text class="props" y="16.9" dy="0.35em">embedding (384 floats)</text></g><g class="node" transform="translate(103.3,0)"><circle r="34" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-7.8" dy="0.35em">Topic</text><text class="props" y="9.1" dy="0.35em">name</text></g></g><g><g transform="translate(10.2,-33.1) rotate(9.7)"><text class="type" y="0" dy="0.35em">ABOUT</text></g><g transform="translate(10.2,33.1) rotate(-9.7)"><text class="type" y="0" dy="0.35em">DECIDED</text><text class="rprops" y="15" dy="0.35em">text · ts</text></g></g></svg>
