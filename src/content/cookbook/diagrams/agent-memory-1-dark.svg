<svg id="d-agent-memory-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 603px;" viewBox="-297 -218 603 450" role="img" aria-labelledby="d-agent-memory-1-dark-title d-agent-memory-1-dark-desc"><title id="d-agent-memory-1-dark-title">Data model: messages, the entities they mention, and the facts and decisions drawn from them</title><desc id="d-agent-memory-1-dark-desc">Each Message is IN_SESSION of a Session and MENTIONS the Entity nodes it names. Fact and Decision nodes are drawn FROM a Message and are ABOUT an Entity. A newer Fact or Decision SUPERSEDES the one it replaces in the same slot.</desc><style>#d-agent-memory-1-dark{font-family:"Relate Sans",system-ui,sans-serif}#d-agent-memory-1-dark text{text-anchor:middle}#d-agent-memory-1-dark .rel{fill:none;stroke:#80808A;stroke-width:2}#d-agent-memory-1-dark .dash{stroke-dasharray:6 4}#d-agent-memory-1-dark .head{fill:#80808A}#d-agent-memory-1-dark .node circle{stroke-width:2}#d-agent-memory-1-dark .label{font-size:14px;font-weight:600;fill:#0A1114}#d-agent-memory-1-dark .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-agent-memory-1-dark .type,#d-agent-memory-1-dark .rprops{stroke:#18181C;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-agent-memory-1-dark .type{font-size:12px;font-weight:600;fill:#F1F1F3}#d-agent-memory-1-dark .rprops{font-size:11px;font-weight:400;fill:#9B9BA3}</style><g><path class="rel" d="M85.5,-21.4 C121.5,-22.1 157.4,-22.8 193.4,-23.5"/><path class="head" d="M200.4,-23.7 L190.5,-19 L190.3,-28 Z"/><path class="rel" d="M-9.8,-8 C-43,0.9 -76.1,9.8 -109.2,18.7"/><path class="head" d="M-116,20.5 L-107.5,13.5 L-105.1,22.2 Z"/><path class="rel" d="M-3.1,100.8 C4.4,78.2 11.8,55.7 19.3,33.1"/><path class="head" d="M21.5,26.5 L22.6,37.4 L14.1,34.6 Z"/><path class="rel" d="M-60.2,-105 C-42,-89.2 -23.8,-73.4 -5.6,-57.6"/><path class="head" d="M-0.4,-53 L-10.9,-56.1 L-4.9,-62.9 Z"/><path class="rel" d="M-65.8,116.7 C-84.2,99.4 -102.5,82.2 -120.8