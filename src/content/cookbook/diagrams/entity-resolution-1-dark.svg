another entity</text></g></g><g><g transform="translate(-71.8,-17.4) rotate(48.7)"><text class="type" y="0" dy="0.35em">RESOLVES_TO</text></g><g transform="translate(-108.8,88.1) rotate(-9.7)"><text class="type" y="0" dy="0.35em">RESOLVES_TO</text></g><g transform="translate(43,-30.2) rotate(-68.4)"><text class="type" y="0" dy="0.35em">HAS_TOKEN</text></g><g transform="translate(193.6,-138.6)"><text class="type" y="-7.1" dy="0.35em">SIMILAR</text><text class="rprops" y="7.8" dy="0.35em">dice</text></g><g transform="translate(151.7,8.6) rotate(-1.7)"><text class="type" y="0" dy="0.35em">CANDIDATE</text><text class="rprops" y="15" dy="0.35em">score · sameDomain · sameCity</text></g><g transform="translate(152,65.5) rotate(-1.3)"><text class="type" y="0" dy="0.35em">SAME_AS</text><text class="rprops" y="15" dy="0.35em">score</text></g><g transform="translate(154.2,122.3) rotate(-0.8)"><text class="type" y="0" dy="0.35em">POSSIBLE_MATCH</text><text class="rprops" y="15" dy="0.35em">score · reason</text></g></g></svg>
