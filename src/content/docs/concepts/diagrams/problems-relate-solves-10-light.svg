<svg id="d-problems-relate-solves-10-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 337px;" viewBox="-168 -127 337 188" role="img" aria-labelledby="d-problems-relate-solves-10-light-title d-problems-relate-solves-10-light-desc"><title id="d-problems-relate-solves-10-light-title">Recommended data model for dependency analysis: package versions, what they depend on, and the advisories that affect them</title><desc id="d-problems-relate-solves-10-light-desc">A Version DEPENDS_ON other Version nodes, and each DEPENDS_ON relationship records its version requirement. Any Version can be AFFECTED_BY an Advisory, which has an id, a title and a score.</desc><style>#d-problems-relate-solves-10-light{font-family:"Public Sans",system-ui,sans-serif}#d-problems-relate-solves-10-light text{text-anchor:middle}#d-problems-relate-solves-10-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-problems-relate-solves-10-light .dash{stroke-dasharray:6 4}#d-problems-relate-solves-10-light .head{fill:#A5ABB6}#d-problems-relate-solves-10-light .node circle{stroke-width:2}#d-problems-relate-solves-10-light .label{font-size:14px;font-weight:600;fill:#181414}#d-problems-relate-solves-10-light .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-problems-relate-solves-10-light .type,#d-problems-relate-solves-10-light .rprops{stroke:#FCF9F6;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-problems-relate-solves-10-light .type{font-size:12px;font-weight:600;fill:#181414}#d-problems-relate-solves-10-light .rprops{font-size:11px;font-weight:400;fill:#4F4E4D}</style><g><path class="rel" d="M-124.9,-41.1 C-160.1,-87.2 -62.4,-91.3 -90.7,-48.9"/><path class="head" d="M-94.6,-43.1 L-92.8,-53.9 L-85.3,-48.9 Z"/><path class="rel" d="M-64.2,0 C-25,0 14.2,0 53.5,0"/><path class="head" d="M60.5,0 L50.5,4.5 L50.5,-4.5 Z"/></g><g><g class="node" transform="translate(-108.5,0)"><circle r="44.3" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-15.6