<svg id="d-agent-memory-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 607px;" viewBox="-302 -216 607 447" role="img" aria-labelledby="d-agent-memory-1-dark-title d-agent-memory-1-dark-desc"><title id="d-agent-memory-1-dark-title">Data model: messages, the entities they mention, and the facts and decisions drawn from them</title><desc id="d-agent-memory-1-dark-desc">Each Message is IN_SESSION of a Session and MENTIONS the Entity nodes it names. Fact and Decision nodes are drawn FROM a Message and are ABOUT an Entity. A newer Fact or Decision SUPERSEDES the one it replaces in the same slot.</desc><style>#d-agent-memory-1-dark{font-family:"Public Sans",system-ui,sans-serif}#d-agent-memory-1-dark text{text-anchor:middle}#d-agent-memory-1-dark .rel{fill:none;stroke:#6FB9C2;stroke-width:2}#d-agent-memory-1-dark .dash{stroke-dasharray:6 4}#d-agent-memory-1-dark .head{fill:#6FB9C2}#d-agent-memory-1-dark .node circle{stroke-width:2}#d-agent-memory-1-dark .label{font-size:14px;font-weight:600;fill:#181414}#d-agent-memory-1-dark .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-agent-memory-1-dark .type,#d-agent-memory-1-dark .rprops{stroke:#014063;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-agent-memory-1-dark .type{font-size:12px;font-weight:600;fill:#F2EAD4}#d-agent-memory-1-dark .rprops{font-size:11px;font-weight:400;fill:#8FE3E8}</style><g><path class="rel" d="M83.8,-23.6 C120.1,-24.3 156.3,-25 192.6,-25.8"/><path class="head" d="M199.6,-25.9 L189.7,-21.2 L189.5,-30.2 Z"/><path class="rel" d="M-9.7,-8.9 C-42.9,1 -76.1,10.9 -109.2,20.8"/><path class="head" d="M-115.9,22.8 L-107.6,15.6 L-105.1,24.2 Z"/><path class="rel" d="M0,99.1 C6.7,76.3 13.5,53.6 20.2,30.9"/><path class="head" d="M22.2,24.2 L23.7,35 L15,32.5 Z"/><path class="rel" d="M-62.8,-104 C-44.2,-88.7 -25.6,-73.4 -7,-58.1"/><path class="head" d="M-1.6,-53.6 L-12.2,-56.5 L-6.5,-63.4 Z"/><path class="rel" d="M-62.4,117 C-81.4,100.3 -100.4,83.6 -119.4