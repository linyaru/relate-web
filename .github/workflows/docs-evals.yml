# The cold-start eval (DOCS-PLAN.md §3.8; scripts/docs-evals.ts): the task
# suite in scripts/evals/tasks.json through one headless coding agent under
# the three conditions (nothing, the AGENTS.md block, the skill), graded by
# assertions on the stores it leaves, then a pull request with
# src/content/docs/_data/evals.json and the summary for a person to review. No model grades anything, and nothing is committed to main: the
# only commit goes to the pull request's branch.
#
# Triggers (never a schedule or a push: every run spends money on the
# operator's model account):
#   - workflow_dispatch, by hand, with the inputs below
#   - repository_dispatch, type relate-release (the release signal
#     engine-release.yml also receives), only once the operator has opted in
#     by setting the repository variables DOCS_EVALS_AGENT_PACKAGE and
#     DOCS_EVALS_HARNESS; without them the job is skipped. It grades the
#     latest relate release (install.sh resolves it, so on this dispatch the
#     release just published; the scores record the version the binary
#     prints) against the docs as they are on the default branch.
#
# Inputs (workflow_dispatch), and the repository variables a relate-release
# run reads in their place:
#   agent_package  DOCS_EVALS_AGENT_PACKAGE: the agent CLI as a pinned npm
#                  spec, installed with npm install -g (Claude Code:
#                  @anthropic-ai/claude-code@<version>, from
#                  https://code.claude.com/docs/en/setup)
#   agent_command  DOCS_EVALS_AGENT_COMMAND: DOCS_EVALS_AGENT (default: the
#                  Claude Code wrapper, scripts/evals/agents/claude-code.sh)
#   harness        DOCS_EVALS_HARNESS: the name and version the scores carry
#   conditions     DOCS_EVALS_CONDITIONS: a comma list (default: all three)
#
# Secrets (the operator sets the one the agent needs; the run fails closed
# without either):
#   ANTHROPIC_API_KEY  for Claude Code (the wrapper reads only this key)
#   CODEX_API_KEY      for Codex (codex exec reads it,
#                      https://learn.chatgpt.com/docs/non-interactive-mode)
#   RELEASE_PR_TOKEN   optional: opens the pull request so the required
#                      Cookbook check starts (as in engine-release.yml)
#
# Two jobs, because the agent runs with unrestricted Bash and reads untrusted
# content (the docs and skill it reads, the task files):
#   evals  contents: read only. The checkout keeps no credential in
#          .git/config (persist-credentials: false); the model keys are given
#          to the one step that runs the agent, and scripts/docs-evals.ts
#          passes the agent only an allowlist of variables (its header), so
#          no GitHub token reaches it. Uploads evals.json and the summary.
#   pr     contents: write and pull-requests: write; runs no agent and no
#          code from the artifact. It checks the artifact's evals.json with
#          the harness's own data check (evalsProblems), copies it into
#          place and opens the pull request. A person reviews the diff and
#          the body, which come from the agent's job, before merge.
#
# Pre-launch, the install step fails: public/install.sh resolves the latest
# relate release, and none is published yet (LAUNCH.md).
name: Docs evals

on:
  workflow_dispatch:
    inputs:
      agent_package:
        description: The agent CLI as a pinned npm spec (name@version)
        required: true
      agent_command:
        description: DOCS_EVALS_AGENT, the command that runs the agent
        required: false
        default: bash scripts/evals/agents/claude-code.sh
      harness:
        description: DOCS_EVALS_HARNESS, the agent's name and version for the scores
        required: true
      conditions:
        description: Conditions, a comma list
        required: false
        default: none,agents-md,skill
  repository_dispatch:
    types: [relate-release]

permissions:
  contents: read

concurrency:
  group: docs-evals
  cancel-in-progress: false

env:
  DO_NOT_TRACK: '1'

jobs:
  evals:
    # A relate-release run needs the operator's opt-in (the two variables).
    if: github.event_name == 'workflow_dispatch' || (vars.DOCS_EVALS_AGENT_PACKAGE != '' && vars.DOCS_EVALS_HARNESS != '')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      AGENT_PACKAGE: ${{ inputs.agent_package || vars.DOCS_EVALS_AGENT_PACKAGE }}
      HARNESS: ${{ inputs.harness || vars.DOCS_EVALS_HARNESS }}
      AGENT_COMMAND: ${{ inputs.agent_command || vars.DOCS_EVALS_AGENT_COMMAND || 'bash scripts/evals/agents/claude-code.sh' }}
      CONDITIONS: ${{ inputs.conditions || vars.DOCS_EVALS_CONDITIONS || 'none,agents-md,skill' }}
    steps:
      - name: Check the inputs and secrets
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_CODEX: ${{ secrets.CODEX_API_KEY != '' }}
        run: |
          if ! [[ "$AGENT_PACKAGE" =~ ^(@[a-z0-9._-]+/)?[a-z0-9._-]+@[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::agent_package must pin an exact version (name@X.Y.Z), not '$AGENT_PACKAGE'"
            exit 1
          fi
          if [ -z "$HARNESS" ]; then
            echo "::error::harness (DOCS_EVALS_HARNESS) names the agent and its version for the scores"
            exit 1
          fi
          if [ "$HAS_ANTHROPIC" != true ] && [ "$HAS_CODEX" != true ]; then
            echo "::error::neither ANTHROPIC_API_KEY nor CODEX_API_KEY is set: the agent has no credential"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # install.sh verifies the SSHSIG signature on SHA256SUMS, the signed
      # release header and the binary's SHA-256 before it installs anything.
      # The token (contents: read) is given to this step only.
      - name: Install the latest relate release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash public/install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the agent
        run: npm install -g "$AGENT_PACKAGE"

      - name: Run the evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          TRIGGER: ${{ github.event_name }}
        run: |
          relate --version
          export RELATE_BIN="$HOME/.local/bin/relate"
          export DOCS_EVALS_AGENT="$AGENT_COMMAND" DOCS_EVALS_HARNESS="$HARNESS"
          out="$RUNNER_TEMP/evals-out"
          mkdir -p "$out"
          # --out merges this run into the copy, so the artifact is the whole new data file.
          cp src/content/docs/_data/evals.json "$out/evals.json"
          {
            echo "Cold-start eval scores from \`node scripts/docs-evals.ts\` (DOCS-PLAN.md §3.8): $HARNESS ($AGENT_PACKAGE), conditions $CONDITIONS, started by $TRIGGER."
            echo
            echo "Review before merge: every failed assertion is listed with what came back. No model graded these."
            echo
          } > "$out/body.md"
          node scripts/docs-evals.ts --condition "$CONDITIONS" --out "$out/evals.json" >> "$out/body.md"
          cat "$out/body.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: docs-evals
          path: ${{ runner.temp }}/evals-out/
          if-no-files-found: error
          retention-days: 7

  pr:
    needs: evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: docs-evals
          path: ${{ runner.temp }}/evals-out

      # The artifact is the whole new data file (the committed one with this
      # run merged in); it must pass the harness's data check.
      - name: Check and place the scores
        env:
          OUT: ${{ runner.temp }}/evals-out
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { evalsProblems } from "./scripts/evals/harness.ts";
            const p = evalsProblems(JSON.parse(readFileSync(process.env.OUT + "/evals.json", "utf8")));
            if (p.length) { console.error("evals.json from the evals job is not an evals data file:\n" + p.join("\n")); process.exit(1); }
          '
          cp "$OUT/evals.json" src/content/docs/_data/evals.json

      - name: Open the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          base: main
          branch: docs-evals/${{ github.run_id }}
          delete-branch: true
          add-paths: src/content/docs/_data/evals.json
          commit-message: Record the docs eval scores (${{ inputs.harness || vars.DOCS_EVALS_HARNESS }})
          title: Record the docs eval scores (${{ inputs.harness || vars.DOCS_EVALS_HARNESS }})
          body-path: ${{ runner.temp }}/evals-out/body.md
