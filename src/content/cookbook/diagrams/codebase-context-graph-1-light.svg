<svg id="d-codebase-context-graph-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 481px;" viewBox="-232 -218 481 406" role="img" aria-labelledby="d-codebase-context-graph-1-light-title d-codebase-context-graph-1-light-desc"><title id="d-codebase-context-graph-1-light-title">Data model: crates, documents and their sections, and the links between them</title><desc id="d-codebase-context-graph-1-light-desc">Crate nodes DEPENDS_ON other crates and CITES ADR documents (Doc:ADR). An ADR CITES other ADRs and SUPERSEDES an earlier one, sometimes only in part; a sectioned ADR HAS_CHUNK sections, and a Chunk MENTIONS crates and CITES ADRs. A Question is linked by dashed, derived ANCHOR relationships to the ADRs and crates it starts from.</desc><style>#d-codebase-context-graph-1-light{font-family:"Relate Sans",system-ui,sans-serif}#d-codebase-context-graph-1-light text{text-anchor:middle}#d-codebase-context-graph-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-codebase-context-graph-1-light .dash{stroke-dasharray:6 4}#d-codebase-context-graph-1-light .head{fill:#A5ABB6}#d-codebase-context-graph-1-light .node circle{stroke-width:2}#d-codebase-context-graph-1-light .label{font-size:14px;font-weight:600;fill:#0A1114}#d-codebase-context-graph-1-light .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-codebase-context-graph-1-light .type,#d-codebase-context-graph-1-light .rprops{stroke:#F2F2F2;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-codebase-context-graph-1-light .type{font-size:12px;font-weight:600;fill:#0A1114}#d-codebase-context-graph-1-light .rprops{font-size:11px;font-weight:400;fill:#59656A}</style><g><path class="rel dash" d="M-138.3,-13.2 C-114.5,-30.3 -90.6,-47.3 -66.8,-64.4"/><path class="head" d="M-61.1,-68.5 L-66.6,-59 L-71.8,-66.3 Z"/><path class="rel dash" d="M-133.6,29.7 C-105.8,41.4 -78,53.1 -50.3,64.9"/><path class="head" d="M-43.8,67.6 L-54.8,67.8 L-51.3,59.5 Z"/><path class="rel" d="M45.