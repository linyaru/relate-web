<svg id="d-langgraph-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 517px;" viewBox="-238 -158 517 313" role="img" aria-labelledby="d-langgraph-1-dark-title d-langgraph-1-dark-desc"><title id="d-langgraph-1-dark-title">Data model: episodes attach to the team graph</title><desc id="d-langgraph-1-dark-desc">Each Episode is IN_CONVERSATION of one Conversation, keyed by the LangGraph thread id. An Episode MENTIONS the Person and Project nodes it names. The team graph's WORKS_ON relationships connect people to projects, so recall can add what no episode said.</desc><style>#d-langgraph-1-dark{font-family:"Relate Sans",system-ui,sans-serif}#d-langgraph-1-dark text{text-anchor:middle}#d-langgraph-1-dark .rel{fill:none;stroke:#80808A;stroke-width:2}#d-langgraph-1-dark .dash{stroke-dasharray:6 4}#d-langgraph-1-dark .head{fill:#80808A}#d-langgraph-1-dark .node circle{stroke-width:2}#d-langgraph-1-dark .label{font-size:14px;font-weight:600;fill:#0A1114}#d-langgraph-1-dark .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-langgraph-1-dark .type,#d-langgraph-1-dark .rprops{stroke:#18181C;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-langgraph-1-dark .type{font-size:12px;font-weight:600;fill:#F1F1F3}#d-langgraph-1-dark .rprops{font-size:11px;font-weight:400;fill:#9B9BA3}</style><g><path class="rel" d="M12.4,-87.2 C57.3,-67.8 102.3,-48.5 147.2,-29.1"/><path class="head" d="M153.6,-26.3 L142.7,-26.2 L146.2,-34.4 Z"/><path class="rel" d="M-58.3,-79.2 C-85.1,-59.7 -111.8,-40.2 -138.6,-20.7"/><path class="head" d="M-144.2,-16.5 L-138.8,-26.1 L-133.5,-18.8 Z"/><path class="rel" d="M-20.5,-62.7 C-16.4,-27 -12.3,8.7 -8.1,44.4"/><path class="head" d="M-7.3,51.3 L-13,41.9 L-4,40.9 Z"/><path class="rel" d="M-141,29 C-110.5,43.8 -79.9,58.7 -49.4,73.6"/><path class="head" d="M-43.1,76.6 L-54.1,76.3 L-50.1,68.2 Z"/></g><g><g class="node" transform="translate(-25.2,-103.4)"><circle r="40.9" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-7.8" dy="0.35em">Episode</text><text class="props" y="9.1" dy="0.35em">seq · text</text></g><g class="node" transform="translate(207.7,-3.1)"><circle r="57.8" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-7.8" dy="0.35em">Conversation</text><text class="props" y="9.1" dy="0.35em">id</text></g><g class="node" transform="translate(-180.3,9.8)"><circle r="43.7" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-7.8" dy="0.35em">Person</text><text class="props" y="9.1" dy="0.35em">name · role</text></g><g class="node" transform="translate(-2.1,96.6)"><circle r="44.6" fill="#A5ABB6" stroke="#81858E"/><text class="label" y="-15.6" dy="0.35em">Project</text><text class="props" y="1.3" dy="0.35em">name</text><text class="props" y="16.9" dy="0.35em">language</text></g></g><g><g transform="translate(83,-56.8) rotate(23.3)"><text class="type" y="0" dy="0.35em">IN_CONVERSATION</text></g><g transform="translate(-101.3,-47.9) rotate(-36.1)"><text class="type" y="0" dy="0.35em">MENTIONS</text></g><g transform="translate(-13.9,-5.7) rotate(83.4)"><text class="type" y="0" dy="0.35em">MENTIONS</text></g><g transform="translate(-92.1,52.8) rotate(26)"><text class="type" y="0" dy="0.35em">WORKS_ON</text></g></g></svg>
