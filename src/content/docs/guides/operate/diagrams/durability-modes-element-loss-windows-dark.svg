<!-- element sha256:de0b9c1e6374b7fe22df016b12f5f34c80a1e56386c1f040f27d17c4c76a643a -->
<svg id="loss-windows-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 760px;" viewBox="0 0 760 358" role="img" aria-labelledby="loss-windows-dark-title loss-windows-dark-desc"><title id="loss-windows-dark-title">What each durability mode can lose in a crash, as relate documents it</title><desc id="loss-windows-dark-desc">What a crash 4.6 s after a checkpoint can lose: Acknowledged writes on a ten-second timeline after a completed checkpoint, with a crash at 4.6 s. Under full, all 8 writes acknowledged before the crash come back: each returned only after its WAL record was synced. Under everysecond, the last background sync was at 4 s, so the 2 writes acknowledged in the 0.6 s after it can be lost. Slow storage or a delayed sync makes the window longer. Under snapshot, nothing is synced on commit, so all 8 writes acknowledged since the last completed checkpoint can be lost. The next timed checkpoint is due at 300 s; a WAL segment that fills, or a clean close, checkpoints sooner.</desc><style>#loss-windows-dark{font-family:"Relate Sans",system-ui,sans-serif}#loss-windows-dark{font-family:"Relate Sans",system-ui,sans-serif}#loss-windows-dark .zone{fill:none;stroke:#3A3A40;stroke-width:1;stroke-dasharray:6 5}#loss-windows-dark .zl{font-size:12px;font-weight:600;fill:#9B9BA3;letter-spacing:.04em}#loss-windows-dark .box{fill:#101013;stroke:#9B9BA3;stroke-width:1.5}#loss-windows-dark .on .box{fill:#2B383D;stroke:#8FE3E8;stroke-width:2.5}#loss-windows-dark .gone .box{fill:none;stroke-dasharray:5 4}#loss-windows-dark .t{font-size:14px;font-weight:600;fill:#F1F1F3}#loss-windows-dark .s{font-size:12px;fill:#9B9BA3}#loss-windows-dark .m{font-family:"Relate Mono",ui-monospace,monospace;font-size:11.5px;fill:#F1F1F3}#loss-windows-dark .pt{font-size:15px;font-weight:600;fill:#F1F1F3}#loss-windows-dark .arrow path{fill:none;stroke:#9B9BA3;stroke-width:1.5}#loss-windows-dark .arrow polygon{fill:#9B9BA3}#loss-windows-dark .arrow.dash path{stroke-dasharray:5 4}#loss-windows-dark .arrow.on path{stroke:#8FE3E8;stroke-width:2.5}#loss-windows-dark .arrow.on polygon{fill:#8FE3E8}#loss-windows-dark .al{font-size:12px;fill:#9B9BA3}#loss-windows-dark .arrow.on .al{fill:#F1F1F3;font-weight:600}#loss-windows-dark .rec{fill:#212126;stroke:#9B9BA3;stroke-width:1}#loss-windows-dark .rec.new{fill:#2B383D;stroke:#8FE3E8;stroke-width:2}#loss-windows-dark .rt{font-size:10.5px;fill:#F1F1F3;text-anchor:middle}#loss-windows-dark .seg{fill:#18181C;stroke:#3A3A40;stroke-width:1}#loss-windows-dark .sync{fill:#2B3527;stroke:#90CB62;stroke-width:1.5}#loss-windows-dark .syt{font-size:11px;font-weight:600;fill:#F1F1F3}#loss-windows-dark .free{fill:none;stroke:#9B9BA3;stroke-width:1.2;stroke-dasharray:4 4}#loss-windows-dark .axis{stroke:#9B9BA3;stroke-width:1}#loss-windows-dark .tick{stroke:#9B9BA3;stroke-width:1}#loss-windows-dark .tl{font-size:11px;fill:#9B9BA3;text-anchor:middle}#loss-windows-dark .cp{stroke:#F1F1F3;stroke-width:2.5}#loss-windows-dark .sy{stroke:#90CB62;stroke-width:2}#loss-windows-dark .crash{stroke:#FF8E6A;stroke-width:2.5}#loss-windows-dark .ct{font-size:12px;font-weight:600;fill:#FF8E6A}#loss-windows-dark .win{fill:#3D2B28;stroke:#FF8E6A;stroke-width:1;stroke-dasharray:4 3}#loss-windows-dark .ok{fill:#90CB62;stroke:#90CB62;stroke-width:1.5}#loss-windows-dark .lost{fill:#18181C;stroke:#FF8E6A;stroke-width:2}#loss-windows-dark .x{stroke:#FF8E6A;stroke-width:1.8}#loss-windows-dark .mode{font-family:"Relate Mono",ui-monospace,monospace;font-size:13px;font-weight:600;fill:#F1F1F3}#loss-windows-dark .row.on .mode{fill:#8FE3E8}#loss-windows-dark .wt{font-size:11.5px;font-weight:600;fill:#FF8E6A}#loss-windows-dark .note{font-size:12px;fill:#9B9BA3}#loss-windows-dark .band{fill:#101013;stroke:#9B9BA3;stroke-width:1.2}#loss-windows-dark .on .band{fill:#2B383D;stroke:#8FE3E8;stroke-width:2.5}#loss-windows-dark .file{fill:#18181C;stroke:#F1F1F3;stroke-width:2}</style><text class="pt" x="12" y="22">What a crash 4.6 s after a checkpoint can lose</text><g transform="translate(0 32)"><text class="ct" x="409.96" y="18">crash at 4.6 s</text><g class="row" data-mode="full"><text class="mode" x="12" y="82">full</text><line class="axis" x1="116" y1="78" x2="742" y2="78"/><text class="note" x="411.96" y="50">no acknowledged write lost</text><line class="cp" x1="116" y1="62" x2="116" y2="94"/><circle class="ok" cx="147.3" cy="78" r="5"/><circle class="ok" cx="191.12" cy="78" r="5"/><circle class="ok" cx="234.94" cy="78" r="5"/><circle class="ok" cx="266.24" cy="78" r="5"/><circle class="ok" cx="310.06" cy="78" r="5"/><circle class="ok" cx="347.62" cy="78" r="5"/><circle class="ok" cx="378.92" cy="78" r="5"/><circle class="ok" cx="397.7" cy="78" r="5"/></g><g class="row" data-mode="everysecond"><text class="mode" x="12" y="156">everysecond</text><line class="axis" x1="116" y1="152" x2="742" y2="152"/><rect class="win" x="366.4" y="130" width="37.56" height="34" rx="3"/><text class="wt" x="397.96" y="124" text-anchor="end">can lose 2 writes</text><line class="sy" x1="178.6" y1="143" x2="178.6" y2="161"/><line class="sy" x1="241.2" y1="143" x2="241.2" y2="161"/><line class="sy" x1="303.8" y1="143" x2="303.8" y2="161"/><line class="sy" x1="366.4" y1="143" x2="366.4" y2="161"/><line class="sy" x1="429" y1="143" x2="429" y2="161"/><line class="sy" x1="491.6" y1="143" x2="491.6" y2="161"/><line class="sy" x1="554.2" y1="143" x2="554.2" y2="161"/><line class="sy" x1="616.8" y1="143" x2="616.8" y2="161"/><line class="sy" x1="679.4" y1="143" x2="679.4" y2="161"/><line class="sy" x1="742" y1="143" x2="742" y2="161"/><line class="cp" x1="116" y1="136" x2="116" y2="168"/><circle class="ok" cx="147.3" cy="152" r="5"/><circle class="ok" cx="191.12" cy="152" r="5"/><circle class="ok" cx="234.94" cy="152" r="5"/><circle class="ok" cx="266.24" cy="152" r="5"/><circle class="ok" cx="310.06" cy="152" r="5"/><circle class="ok" cx="347.62" cy="152" r="5"/><circle class="lost" cx="378.92" cy="152" r="5.5"/><line class="x" x1="375.5