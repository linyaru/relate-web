<svg id="d-first-graph-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 317px;" viewBox="-158 -112 317 170" role="img" aria-labelledby="d-first-graph-1-dark-title d-first-graph-1-dark-desc"><title id="d-first-graph-1-dark-title">Data model: people, the projects they work on or maintain, and who knows whom</title><desc id="d-first-graph-1-dark-desc">A Person WORKS_ON a Project, with the year it started as since, or MAINTAINS it. A Person KNOWS another Person. A Person has a name and a role; a Project has a name and a language.</desc><style>#d-first-graph-1-dark{font-family:"Relate Sans",system-ui,sans-serif}#d-first-graph-1-dark text{text-anchor:middle}#d-first-graph-1-dark .rel{fill:none;stroke:#80808A;stroke-width:2}#d-first-graph-1-dark .dash{stroke-dasharray:6 4}#d-first-graph-1-dark .head{fill:#80808A}#d-first-graph-1-dark .node circle{stroke-width:2}#d-first-graph-1-dark .label{font-size:14px;font-weight:600;fill:#0A1114}#d-first-graph-1-dark .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-first-graph-1-dark .type,#d-first-graph-1-dark .rprops{stroke:#18181C;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-first-graph-1-dark .type{font-size:12px;font-weight:600;fill:#F1F1F3}#d-first-graph-1-dark .rprops{font-size:11px;font-weight:400;fill:#9B9BA3}</style><g><path class="rel" d="M-60.5,-17.5 C-20.2,-35.1 17.4,-36.3 52.3,-21"/><path class="head" d="M58.8,-18.2 L47.8,-18.1 L51.4,-26.4 Z"/><path class="rel" d="M-60.5,17.5 C-20.2,35.1 17.4,36.3 52.3,21"/><path class="head" d="M58.8,18.2 L51.4,26.4 L47.8,18.1 Z"/><path class="rel" d="M-117.4,-40.3 C-153.1,-86 -55.5,-91.3 -83.3,-48.5"/><path class="head" d="M-87.1,-42.6 L-85.4,-53.5 L-77.9,-48.6 Z"/></g><g><g class="node" transform="translate(-100.6,0)"><circle r="43.7" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-7.8" dy="0.35em">Person</text><text class="props" y="9.1" dy="0.35em">name · role</text></g><g class="node" transform="translate(100.6,0)"><circle r="44.6" fill="#D8C7AE" stroke="#A89B88"/><text class="label" y="-15.6" dy="0.35em">Project</text><text class="props" y="1.3" dy="0.35em">name</text><text class="props" y="16.9" dy="0.35em">language</text></g></g><g><g transform="translate(-0.4,-30.9) rotate(-0.4)"><text class="type" y="0" dy="0.35em">WORKS_ON</text><text class="rprops" y="15" dy="0.35em">since</text></g><g transform="translate(-0.4,30.9) rotate(0.4)"><text class="type" y="0" dy="0.35em">MAINTAINS</text></g><g transform="translate(-104.4,-89.6)"><text class="type" y="0" dy="0.35em">KNOWS</text></g></g></svg>
