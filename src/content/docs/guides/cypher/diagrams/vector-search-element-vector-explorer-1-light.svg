<svg id="vector-explorer-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 640px;" viewBox="0 0 640 516" role="img" aria-labelledby="vector-explorer-1-light-title vector-explorer-1-light-desc"><title id="vector-explorer-1-light-title">The 40 vectors of notes on two principal components, with the question and its top 5</title><desc id="vector-explorer-1-light-desc">40 points on the first two principal components. The question sits at (-0.046, 0.140). Top 5: n02, n25, n03, n15, n04. Colour shows topics: auth, billing, deploy, kafka, observability, planning.</desc><style>#vector-explorer-1-light{font-family:"Relate Sans",system-ui,sans-serif}#vector-explorer-1-light .axis{stroke:#E4E7E8;stroke-width:1;stroke-dasharray:4 4}#vector-explorer-1-light .axis-label{font-size:11px;fill:#59656A}#vector-explorer-1-light .pt{stroke-width:1.2}#vector-explorer-1-light .ring{fill:none;stroke:#0A6190;stroke-width:2.2}#vector-explorer-1-light .rank{font-size:11px;font-weight:600;fill:#0A1114;stroke:#F2F2F2;stroke-width:3px;paint-order:stroke}#vector-explorer-1-light .query{fill:none;stroke:#0A1114;stroke-width:2}#vector-explorer-1-light .query-label{font-size:12px;font-weight:600;fill:#0A1114;stroke:#F2F2F2;stroke-width:3px;paint-order:stroke}#vector-explorer-1-light .legend{font-size:12px;fill:#0A1114}</style><line class="axis" x1="22" y1="229.6" x2="618" y2="229.6"/><line class="axis" x1="305.4" y1="14" x2="305.4" y2="444"/><text class="axis-label" x="618" y="223.6" text-anchor="end">PC1 · 7.2% of variance</text><text class="axis-label" x="311.4" y="14" dy="0.7em">PC2 · 6.4%</text><g class="points" data-list="notes" data-dims="384"><circle class="pt" cx="338.8" cy="370.6" r="5" fill="#D8C7AE" stroke="#A89B88" data-id="n01" data-group="planning" data-x="0.07691" data-y="-0.32479"><title>n01 (planning): Relay kickoff: ticket intake, the agent console and billing all live in one monorepo.</title></circle><circle class="pt" cx="201.5" cy="110.9" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n02" data-group="auth" data-x="-0.23932" data-y="0.27353"><title>n02 (auth): Customer login goes through Auth0; refresh tokens live in HttpOnly cookies.</title></circle><circle class="pt" cx="325.7" cy="265.5" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n03" data-group="auth" data-x="0.04677" data-y="-0.08263"><title>n03 (auth): OAuth callbacks are published to Kafka so the audit service sees every login.</title></circle><circle class="pt" cx="504.4" cy="258.2" r="5" fill="#56C7E4" stroke="#439BB2" data-id="n04" data-group="kafka" data-x="0.45827" data-y="-0.06584"><title>n04 (kafka): Each tenant gets its own Kafka topic for ticket events.</title></circle><circle class="pt" cx="167.2" cy="298.7" r="5" fill="#F79767" stroke="#C17650" data-id="n05" data-group="deploy" data-x="-0.31839" data-y="-0.1591"><title>n05 (deploy): Deploy with Helm charts to the shared staging cluster.</title></circle><circle class="pt" cx="240.5" cy="128.3" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n06" data-group="auth" data-x="-0.14959" data-y="0.23341"><title>n06 (auth): Open question: do support agents and customers share one login page?</title></circle><circle class="pt" cx="382.1" cy="338.3" r="5" fill="#56C7E4" stroke="#439BB2" data-id="n07" data-group="kafka" data-x="0.17667" data-y="-0.25026"><title>n07 (kafka): Kafka consumer lag on the ticket-events group is the first alert to build.</title></circle><circle class="pt" cx="256.9" cy="182.7" r="5" fill="#F79767" stroke="#C17650" data-id="n08" data-group="deploy" data-x="-0.11163" data-y="0.10806"><title>n08 (deploy): Staging deploys take eleven minutes; most of it is image pulls.</title></circle><circle class="pt" cx="320.5" cy="436.0" r="5" fill="#C990C0" stroke="#9D7096" data-id="n09" data-group="billing" data-x="0.03467" data-y="-0.47533"><title>n09 (billing): Billing needs per-seat usage counts from the agent console.</title></circle><circle class="pt" cx="261.9" cy="116.7" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n10" data-group="auth" data-x="-0.10028" data-y="0.2601"><title>n10 (auth): Session cookies expire after twelve hours of inactivity.</title></circle><circle class="pt" cx="322.2" cy="145.5" r="5" fill="#F16767" stroke="#BC5050" data-id="n11" data-group="observability" data-x="0.03863" data-y="0.19383"><title>n11 (observability): Logs from every service are shipped to Loki for now.</title></circle><circle class="pt" cx="317.2" cy="137.4" r="5" fill="#D8C7AE" stroke="#A89B88" data-id="n12" data-group="planning" data-x="0.02717" data-y="0.21242"><title>n12 (planning): Ticket search indexes subject lines only; bodies come later.</title></circle><circle class="pt" cx="178.0" cy="230.4" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n13" data-group="auth" data-x="-0.29339" data-y="-0.00178"><title>n13 (auth): Load test plan: 200 logins per second against staging.</title></circle><circle class="pt" cx="222.7" cy="231.9" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n14" data-group="auth" data-x="-0.19056" data-y="-0.00519"><title>n14 (auth): The Auth0 renewal quote doubled; Okta is cheaper for our seat count.</title></circle><circle class="pt" cx="119.4" cy="199.5" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n15" data-group="auth" data-x="-0.42845" data-y="0.06948"><title>n15 (auth): Migrate customer login from Auth0 to Okta before the April renewal.</title></circle><circle class="pt" cx="200.0" cy="230.1" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n16" data-group="auth" data-x="-0.2429" data-y="-0.001"><title>n16 (auth): Token revocation now propagates in under a second via the Redis session store.</title></circle><circle class="pt" cx="421.2" cy="350.5" r="5" fill="#56C7E4" stroke="#439BB2" data-id="n17" data-group="kafka" data-x="0.26679" data-y="-0.2785"><title>n17 (kafka): Per-tenant topics hit the Kafka partition limit at 900 tenants.</title></circle><circle class="pt" cx="518.9" cy="307.6" r="5" fill="#56C7E4" stroke="#439BB2" data-id="n18" data-group="kafka" data-x="0.49169" data-y="-0.17966"><title>n18 (kafka): Consolidate ticket events into shared Kafka topics keyed by tenant id.</title></circle><circle class="pt" cx="484.2" cy="238.8" r="5" fill="#56C7E4" stroke="#439BB2" data-id="n19" data-group="kafka" data-x="0.41191" data-y="-0.02101"><title>n19 (kafka): Kafka consumers must be idempotent because shared topics replay on rebalance.</title></circle><circle class="pt" cx="179.9" cy="322.3" r="5" fill="#F16767" stroke="#BC5050" data-id="n20" data-group="observability" data-x="-0.2891" data-y="-0.21352"><title>n20 (observability): Traces go to Tempo through the OpenTelemetry collector; Loki keeps the logs.</title></circle><circle class="pt" cx="193.2" cy="288.8" r="5" fill="#F79767" stroke="#C17650" data-id="n21" data-group="deploy" data-x="-0.25845" data-y="-0.13623"><title>n21 (deploy): The deploy pipeline caches base images; staging deploys now take four minutes.</title></circle><circle class="pt" cx="139.1" cy="317.3" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n22" data-group="auth" data-x="-0.38311" data-y="-0.20196"><title>n22 (auth): The Okta tenant needs a custom domain before the login page can move.</title></circle><circle class="pt" cx="394.9" cy="235.9" r="5" fill="#56C7E4" stroke="#439BB2" data-id="n23" data-group="kafka" data-x="0.20604" data-y="-0.01433"><title>n23 (kafka): Kafka lag dashboard added to Grafana with a five minute alert.</title></circle><circle class="pt" cx="374.8" cy="394.4" r="5" fill="#C990C0" stroke="#9D7096" data-id="n24" data-group="billing" data-x="0.15975" data-y="-0.37956"><title>n24 (billing): Billing reads seat counts from the nightly usage snapshot, not from Kafka.</title></circle><circle class="pt" cx="341.7" cy="63.0" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n25" data-group="auth" data-x="0.08351" data-y="0.38374"><title>n25 (auth): Refresh tokens rotate on every use once Okta is live.</title></circle><circle class="pt" cx="347.7" cy="200.6" r="5" fill="#56C7E4" stroke="#439BB2" data-id="n26" data-group="kafka" data-x="0.09751" data-y="0.06686"><title>n26 (kafka): Incident KAFKA-142: a broker disk filled overnight because retention on the audit stream was unbounded; retention is now capped and a disk alert pages the on-call engineer.</title></circle><circle class="pt" cx="520.6" cy="115.1" r="5" fill="#56C7E4" stroke="#439BB2" data-id="n27" data-group="kafka" data-x="0.49567" data-y="0.26377"><title>n27 (kafka): Retention on shared Kafka topics is three days.</title></circle><circle class="pt" cx="230.2" cy="311.6" r="5" fill="#F79767" stroke="#C17650" data-id="n28" data-group="deploy" data-x="-0.1732" data-y="-0.1888"><title>n28 (deploy): Canary releases go through Argo Rollouts with a five percent first step.</title></circle><circle class="pt" cx="261.8" cy="36.0" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n29" data-group="auth" data-x="-0.10038" data-y="0.44604"><title>n29 (auth): Okta cutover is done; Auth0 stays read-only for thirty days.</title></circle><circle class="pt" cx="457.3" cy="289.4" r="5" fill="#C990C0" stroke="#9D7096" data-id="n30" data-group="billing" data-x="0.34998" data-y="-0.13776"><title>n30 (billing): Invoices are generated nightly from Kafka usage events.</title></circle><circle class="pt" cx="271.0" cy="49.9" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n31" data-group="auth" data-x="-0.07918" data-y="0.414"><title>n31 (auth): Magic-link login is requested by three enterprise customers.</title></circle><circle class="pt" cx="393.3" cy="263.0" r="5" fill="#56C7E4" stroke="#439BB2" data-id="n32" data-group="kafka" data-x="0.20247" data-y="-0.0769"><title>n32 (kafka): Kafka status: consumer lag is back under one second after the rebalance fix.</title></circle><circle class="pt" cx="351.2" cy="193.8" r="5" fill="#56C7E4" stroke="#439BB2" data-id="n33" data-group="kafka" data-x="0.10543" data-y="0.08262"><title>n33 (kafka): The Kafka status page is green again; broker CPU is flat.</title></circle><circle class="pt" cx="202.2" cy="349.7" r="5" fill="#F79767" stroke="#C17650" data-id="n34" data-group="deploy" data-x="-0.23784" data-y="-0.27655"><title>n34 (deploy): Deploy freeze for the billing launch starts on the 23rd.</title></circle><circle class="pt" cx="373.3" cy="94.2" r="5" fill="#F16767" stroke="#BC5050" data-id="n35" data-group="observability" data-x="0.15634" data-y="0.31209"><title>n35 (observability): Tempo retention is fourteen days; older traces are sampled out.</title></circle><circle class="pt" cx="248.7" cy="65.1" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n36" data-group="auth" data-x="-0.13072" data-y="0.37899"><title>n36 (auth): Rotating signing keys for Okta sessions is a quarterly job.</title></circle><circle class="pt" cx="302.6" cy="221.8" r="5" fill="#C990C0" stroke="#9D7096" data-id="n37" data-group="billing" data-x="-0.0065" data-y="0.01814"><title>n37 (billing): Billing webhooks retry with exponential backoff up to one hour.</title></circle><circle class="pt" cx="200.4" cy="389.4" r="5" fill="#F79767" stroke="#C17650" data-id="n38" data-group="deploy" data-x="-0.24189" data-y="-0.36809"><title>n38 (deploy): Rollback drill: Argo Rollouts aborted the canary in ninety seconds.</title></circle><circle class="pt" cx="194.0" cy="242.3" r="5" fill="#FFDF81" stroke="#C7AE65" data-id="n39" data-group="auth" data-x="-0.25655" data-y="-0.02918"><title>n39 (auth): Support agents keep a separate SSO login through the corporate Okta.</title></circle><circle class="pt" cx="455.3" cy="164.1" r="5" fill="#56C7E4" stroke="#439BB2" data-id="n40" data-group="kafka" data-x="0.34525" data-y="0.15089"><title>n40 (kafka): Kafka upgrade: brokers are on 3.7 and new clients ship next week.</title></circle></g><circle class="ring" cx="201.5" cy="110.9" r="9"/><text class="rank" x="211.5" y="101.9">1</text><circle class="ring" cx="325.7" cy="265.5" r="9"/><text class="rank" x="335.7" y="256.5">3</text><circle class="ring" cx="504.4" cy="258.2" r="9"/><text class="rank" x="514.4" y="249.2">5</text><circle class="ring" cx="119.4" cy="199.5" r="9"/><text class="rank" x="129.4" y="190.5">4</text><circle class="ring" cx="341.7" cy="63.0" r="9"/><text class="rank" x="351.7" y="54.0">2</text><g data-query="v" data-x="-0.04599" data-y="0.13957"><circle class="query" cx="285.4" cy="169.0" r="7"/><path class="query" d="M274.4 169.0H296.4M285.4 158.0V180.0"/><text class="query-label" x="298.4" y="185.0">question</text></g><g transform="translate(22.0,476)"><circle class="pt" cx="6" cy="0" r="5" fill="#FFDF81" stroke="#C7AE65"/><text class="legend" x="18" dy="0.35em">auth</text></g><g transform="translate(171.0,476)"><circle class="pt" cx="6" cy="0" r="5" fill="#C990C0" stroke="#9D7096"/><text class="legend" x="18" dy="0.35em">billing</text></g><g transform="translate(320.0,476)"><circle class="pt" cx="6" cy="0" r="5" fill="#F79767" stroke="#C17650"/><text class="legend" x="18" dy="0.35em">deploy</text></g><g transform="translate(469.0,476)"><circle class="pt" cx="6" cy="0" r="5" fill="#56C7E4" stroke="#439BB2"/><text class="legend" x="18" dy="0.35em">kafka</text></g><g transform="translate(22.0,498)"><circle class="pt" cx="6" cy="0" r="5" fill="#F16767" stroke="#BC5050"/><text class="legend" x="18" dy="0.35em">observability</text></g><g transform="translate(171.0,498)"><circle class="pt" cx="6" cy="0" r="5" fill="#D8C7AE" stroke="#A89B88"/><text class="legend" x="18" dy="0.35em">planning</text></g><g transform="translate(320.0,498)"><circle class="ring" cx="6" cy="0" r="6"/><text class="legend" x="18" dy="0.35em">top 5</text></g><g transform="translate(469.0,498)"><path class="query" d="M-1 0H13M6 -7V7"/><text class="legend" x="18" dy="0.35em">question</text></g></svg>
