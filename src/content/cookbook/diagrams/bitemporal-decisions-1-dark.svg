<svg id="d-bitemporal-decisions-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 478px;" viewBox="-247 -99 478 205" role="img" aria-labelledby="d-bitemporal-decisions-1-dark-title d-bitemporal-decisions-1-dark-desc"><title id="d-bitemporal-decisions-1-dark-title">Data model: decisions about entities, the decisions they replace, and reviews</title><desc id="d-bitemporal-decisions-1-dark-desc">A Decision is ABOUT an Entity and carries two time ranges: validFrom and validTo for when it held, recordedAt and closedAt for when it was believed. A Decision SUPERSEDES the one it replaces. A Review REJECTS a Decision and records who rejected it, when and why.</desc><style>#d-bitemporal-decisions-1-dark{font-family:"Relate Sans",system-ui,sans-serif}#d-bitemporal-decisions-1-dark text{text-anchor:middle}#d-bitemporal-decisions-1-dark .rel{fill:none;stroke:#80808A;stroke-width:2}#d-bitemporal-decisions-1-dark .dash{stroke-dasharray:6 4}#d-bitemporal-decisions-1-dark .head{fill:#80808A}#d-bitemporal-decisions-1-dark .node circle{stroke-width:2}#d-bitemporal-decisions-1-dark .label{font-size:14px;font-weight:600;fill:#0A1114}#d-bitemporal-decisions-1-dark .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-bitemporal-decisions-1-dark .type,#d-bitemporal-decisions-1-dark .rprops{stroke:#18181C;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-bitemporal-decisions-1-dark .type{font-size:12px;font-weight:600;fill:#F1F1F3}#d-bitemporal-decisions-1-dark .rprops{font-size:11px;font-weight:400;fill:#9B9BA3}</style><g><path class="rel" d="M-146.1,-4.7 C-117.7,2 -89.3,8.7 -60.9,15.4"/><path class="head" d="M-54.1,17 L-64.9,19.1 L-62.8,10.3 Z"/><path class="rel" d="M66.2,15.2 C90.9,8.4 115.6,1.7 140.3,-5.1"/><path class="head" d="M147,-6.9 L138.6,0 L136.2,-8.6 Z"/><path class="rel" d="M-7.3,-28.5 C-40.2,-76.3 57.4,-75.7 27.2,-34.7"/><path class="head" d="M23,-29 L25.3,-39.8 L32.6,-34.4 Z"/></g><g><g class="node" transform="translate(-189,-14.8)"><circle r="44.1" fill="#F16767" stroke="#BC5050"/><text class="label" y="-15.6" dy="0.35em">Review</text><text class="props" y="1.3" dy="0.35em">key · by · at</text><text class="props" y="16.9" dy="0.35em">reason</text></g><g class="node" transform="translate(6.8,31.4)"><circle r="61.6" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-31.2" dy="0.35em">Decision</text><text class="props" y="-14.3" dy="0.35em">id · text</text><text class="props" y="1.3" dy="0.35em">validFrom · validTo</text><text class="props" y="16.9" dy="0.35em">recordedAt</text><text class="props" y="32.5" dy="0.35em">closedAt</text></g><g class="node" transform="translate(182.2,-16.6)"><circle r="35.5" fill="#F79767" stroke="#C17650"/><text class="label" y="-7.8" dy="0.35em">Entity</text><text class="props" y="9.1" dy="0.35em">name</text></g></g><g><g transform="translate(-100.1,6.2) rotate(13.3)"><text class="type" y="0" dy="0.35em">REJECTS</text></g><g transform="translate(106.6,4.1) rotate(-15.3)"><text class="type" y="0" dy="0.35em">ABOUT</text></g><g transform="translate(8.6,-76.6)"><text class="type" y="0" dy="0.35em">SUPERSEDES</text></g></g></svg>
