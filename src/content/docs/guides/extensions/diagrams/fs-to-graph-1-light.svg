<svg id="d-fs-to-graph-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 331px;" viewBox="-158 -110 331 181" role="img" aria-labelledby="d-fs-to-graph-1-light-title d-fs-to-graph-1-light-desc"><title id="d-fs-to-graph-1-light-title">Data model: folders that contain folders and files</title><desc id="d-fs-to-graph-1-light-desc">A Folder CONTAINS other Folder nodes and File nodes, one level at a time, from the imported folder down. A Folder holds its path, name, and depth; a File holds its path, name, extension, and size, and its text as content when the file qualifies.</desc><style>#d-fs-to-graph-1-light{font-family:"Relate Sans",system-ui,sans-serif}#d-fs-to-graph-1-light text{text-anchor:middle}#d-fs-to-graph-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-fs-to-graph-1-light .dash{stroke-dasharray:6 4}#d-fs-to-graph-1-light .head{fill:#A5ABB6}#d-fs-to-graph-1-light .node circle{stroke-width:2}#d-fs-to-graph-1-light .label{font-size:14px;font-weight:600;fill:#0A1114}#d-fs-to-graph-1-light .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-fs-to-graph-1-light .type,#d-fs-to-graph-1-light .rprops{stroke:#F2F2F2;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-fs-to-graph-1-light .type{font-size:12px;font-weight:600;fill:#0A1114}#d-fs-to-graph-1-light .rprops{font-size:11px;font-weight:400;fill:#59656A}</style><g><path class="rel" d="M-116.9,-40.1 C-149.9,-87.7 -52.2,-87.3 -82.4,-46.2"/><path class="head" d="M-86.5,-40.6 L-84.2,-51.3 L-77,-46 Z"/><path class="rel" d="M-59.8,0 C-27.4,0 4.9,0 37.3,0"/><path class="head" d="M44.3,0 L34.3,4.5 L34.3,-4.5 Z"/></g><g><g class="node" transform="translate(-102.4,0)"><circle r="42.6" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-15.6" dy="0.35em">Folder</text><text class="props" y="1.3" dy="0.35em">path · name</text><text class="props" y="16.9" dy="0.35em">depth</text></g><g class="node" transform="translate(102.4,0)"><circle r="57.1" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-31.2" dy="0.35em">File</text><text class="props" y="-14.3" dy="0.35em">path</text><text class="props" y="1.3" dy="0.35em">name · extension</text><text class="props" y="16.9" dy="0.35em">size_bytes</text><text class="props" y="32.5" dy="0.35em">content</text></g></g><g><g transform="translate(-101,-87.9)"><text class="type" y="0" dy="0.35em">CONTAINS</text></g><g transform="translate(-7.7,0) rotate(0)"><text class="type" y="0" dy="0.35em">CONTAINS</text></g></g></svg>
