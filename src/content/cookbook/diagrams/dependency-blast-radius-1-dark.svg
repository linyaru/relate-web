<svg id="d-dependency-blast-radius-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 423px;" viewBox="-207 -190 423 345" role="img" aria-labelledby="d-dependency-blast-radius-1-dark-title d-dependency-blast-radius-1-dark-desc"><title id="d-dependency-blast-radius-1-dark-title">Data model: package versions, what they depend on, and the advisories that affect them</title><desc id="d-dependency-blast-radius-1-dark-desc">A root package version (Version:Root) DEPENDS_ON other Version nodes, which depend on further versions in turn; each DEPENDS_ON relationship records its version requirement. Any Version, the root included, can be AFFECTED_BY an Advisory, which has an id, a title and a CVSS 3 score.</desc><style>#d-dependency-blast-radius-1-dark{font-family:"Relate Sans",system-ui,sans-serif}#d-dependency-blast-radius-1-dark text{text-anchor:middle}#d-dependency-blast-radius-1-dark .rel{fill:none;stroke:#80808A;stroke-width:2}#d-dependency-blast-radius-1-dark .dash{stroke-dasharray:6 4}#d-dependency-blast-radius-1-dark .head{fill:#80808A}#d-dependency-blast-radius-1-dark .node circle{stroke-width:2}#d-dependency-blast-radius-1-dark .label{font-size:14px;font-weight:600;fill:#0A1114}#d-dependency-blast-radius-1-dark .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-dependency-blast-radius-1-dark .type,#d-dependency-blast-radius-1-dark .rprops{stroke:#18181C;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-dependency-blast-radius-1-dark .type{font-size:12px;font-weight:600;fill:#F1F1F3}#d-dependency-blast-radius-1-dark .rprops{font-size:11px;font-weight:400;fill:#9B9BA3}</style><g><path class="rel" d="M-89,-8.9 C-61.2,-34.5 -33.3,-60.1 -5.5,-85.8"/><path class="head" d="M-0.4,-90.5 L-4.7,-80.4 L-10.8,-87.1 Z"/><path class="rel" d="M88.2,-121.2 C144.6,-134.6 108.7,-43.8 81.4,-86.8"/><path class="head" d="M77.7,-92.8 L86.8,-86.7 L79.2,-81.9 Z"/><path class="rel" d="M-75.2,47.4 C-36.4,58 2.5,68.6 41.3,79.1"/><path clas