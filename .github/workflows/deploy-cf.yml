# Publishes the static site to Cloudflare Pages (project: relate-web).
# main -> production; pull requests -> preview deployments (same-repo PRs only,
# since fork PRs have no access to secrets).
#
# One-time setup:
#   1. Create the project:  npx wrangler pages project create relate-web --production-branch main
#   2. Repo secrets: CLOUDFLARE_API_TOKEN (Pages: Edit), CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build

      - name: Sanity check
        run: |
          test -s dist/index.html
          test -s dist/wasm/relate_bg.wasm
          test -s dist/wasm/relate.js
          test -s dist/CNAME

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=relate-web --branch=${{ github.head_ref || github.ref_name }}
