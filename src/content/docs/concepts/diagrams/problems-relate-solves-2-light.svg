<svg id="d-problems-relate-solves-2-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 363px;" viewBox="-198 -136 363 330" role="img" aria-labelledby="d-problems-relate-solves-2-light-title d-problems-relate-solves-2-light-desc"><title id="d-problems-relate-solves-2-light-title">Recommended data model for agent memory: entities, the episodes that mention them, and facts with their evidence</title><desc id="d-problems-relate-solves-2-light-desc">An Episode MENTIONS the Entity nodes it names. A Fact is ABOUT one or more entities and comes FROM the Episode that is its evidence. A newer Fact SUPERSEDES the one it replaced in the same slot, so a correction keeps the history.</desc><style>#d-problems-relate-solves-2-light{font-family:"Relate Sans",system-ui,sans-serif}#d-problems-relate-solves-2-light text{text-anchor:middle}#d-problems-relate-solves-2-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-problems-relate-solves-2-light .dash{stroke-dasharray:6 4}#d-problems-relate-solves-2-light .head{fill:#A5ABB6}#d-problems-relate-solves-2-light .node circle{stroke-width:2}#d-problems-relate-solves-2-light .label{font-size:14px;font-weight:600;fill:#0A1114}#d-problems-relate-solves-2-light .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-problems-relate-solves-2-light .type,#d-problems-relate-solves-2-light .rprops{stroke:#F2F2F2;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-problems-relate-solves-2-light .type{font-size:12px;font-weight:600;fill:#0A1114}#d-problems-relate-solves-2-light .rprops{font-size:11px;font-weight:400;fill:#59656A}</style><g><path class="rel" d="M-30.6,-64 C-0.5,-54.8 29.5,-45.7 59.6,-36.5"/><path class="head" d="M66.3,-34.5 L55.5,-33.1 L58.1,-41.7 Z"/><path class="rel" d="M8.4,62.9 C28.7,45.7 49.1,28.6 69.5,11.4"/><path class="head" d="M74.8,6.9 L70.1,16.8 L64.3,9.9 Z"/><path class="rel" d="M-46.7,44.4 C-51.9,21.3 -57.2,-1.8 -62.4,-24.9"/><path class="head" d="M-64,-31.7 L-57.4,-23 L-6