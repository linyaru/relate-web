<svg id="d-query-the-relate-docs-1-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 636px;" viewBox="-314 -136 636 244" role="img" aria-labelledby="d-query-the-relate-docs-1-light-title d-query-the-relate-docs-1-light-desc"><title id="d-query-the-relate-docs-1-light-title">Data model: pages have sections and link to pages, and questions carry vectors</title><desc id="d-query-the-relate-docs-1-light-desc">A Page has an id, a title and a URL, links to other Pages, and HAS_SECTION relationships to its Sections. A Section has a heading, its text and a 384-float embedding. A Question stands alone, holding a question's text and its embedding.</desc><style>#d-query-the-relate-docs-1-light{font-family:"Public Sans",system-ui,sans-serif}#d-query-the-relate-docs-1-light text{text-anchor:middle}#d-query-the-relate-docs-1-light .rel{fill:none;stroke:#A5ABB6;stroke-width:2}#d-query-the-relate-docs-1-light .dash{stroke-dasharray:6 4}#d-query-the-relate-docs-1-light .head{fill:#A5ABB6}#d-query-the-relate-docs-1-light .node circle{stroke-width:2}#d-query-the-relate-docs-1-light .label{font-size:14px;font-weight:600;fill:#181414}#d-query-the-relate-docs-1-light .props{font-size:12px;font-weight:400;fill:#181414;fill-opacity:0.78}#d-query-the-relate-docs-1-light .type,#d-query-the-relate-docs-1-light .rprops{stroke:#FCF9F6;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-query-the-relate-docs-1-light .type{font-size:12px;font-weight:600;fill:#181414}#d-query-the-relate-docs-1-light .rprops{font-size:11px;font-weight:400;fill:#4F4E4D}</style><g><path class="rel" d="M30.3,-22 C67.9,-15.3 105.5,-8.5 143.1,-1.7"/><path class="head" d="M150,-0.5 L139.4,2.2 L141,-6.7 Z"/><path class="rel" d="M-21.1,-65.5 C-52.4,-114.4 45.3,-110.3 13.6,-70.4"/><path class="head" d="M9.2,-64.9 L11.9,-75.5 L19,-69.9 Z"/></g><g><g class="node" transform="translate(-8,-28.9)"><circle r="38.9" fill="#FFDF81" stroke="#C7AE65"/><text class="label" y="-15.6" dy="0.35em">Page</text><text class="props" y="1.3" dy="0.35em">id · title</text><text class="props" y="16.9" dy="0.35em">url</text></g><g class="node" transform="translate(229,13.7)"><circle r="79.2" fill="#C990C0" stroke="#9D7096"/><text class="label" y="-15.6" dy="0.35em">Section</text><text class="props" y="1.3" dy="0.35em">id · heading · text</text><text class="props" y="16.9" dy="0.35em">embedding (384 floats)</text></g><g class="node" transform="translate(-221,15.2)"><circle r="79.2" fill="#F79767" stroke="#C17650"/><text class="label" y="-15.6" dy="0.35em">Question</text><text class="props" y="1.3" dy="0.35em">text</text><text class="props" y="16.9" dy="0.35em">embedding (384 floats)</text></g></g><g><g transform="translate(90.2,-11.3) rotate(10.2)"><text class="type" y="0" dy="0.35em">HAS_SECTION</text></g><g transform="translate(-3.5,-113.8)"><text class="type" y="0" dy="0.35em">LINKS_TO</text></g></g></svg>
