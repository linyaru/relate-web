# Publishes the static site to Cloudflare Pages (project: relate-web), then the
# hosted docs MCP server (workers/docs-mcp, a Worker) on pushes to main.
# main -> production; pull requests -> preview deployments of the site only
# (same-repo PRs only, since fork PRs have no access to secrets). The Worker has
# no preview: it deploys only from main, after the site, so the docs it bundles
# are the docs the site serves.
#
# One-time setup:
#   1. Create the project:  npx wrangler pages project create relate-web --production-branch main
#   2. Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. The token needs
#      Pages: Edit for the site and, for the Worker, Workers Scripts: Edit and
#      Workers Routes: Edit on the relatedb.ai zone.
#
# What the Worker needs at launch (ADR-0012; LAUNCH.md lists these):
#   - The relatedb.ai zone in the same account. workers/docs-mcp/wrangler.jsonc
#     routes relatedb.ai/mcp to the Worker and every other path stays with
#     Pages. That a Worker route fronts /mcp on the Pages custom domain is not
#     verified yet (no account here); if it cannot, the site moves to one Worker
#     with static assets (ADR-0012 "Later references").
#   - Workers Paid: the bundle is about 3 MB gzipped and the cold seed replay
#     takes about 0.3 s of CPU (workers/docs-mcp/README.md "Sizes", "Cold start").
#   - The rate limiting bindings RL_IP (20 requests per 10 s per IP) and RL_COST
#     (120 units per 60 s per IP and tool), declared under `ratelimits` in
#     wrangler.jsonc. Without them the Worker falls back to a per-isolate window
#     and /healthz reports "in-isolate-fixed-window".
#   - Deploy order: the site first, then the Worker (this file's step order).
#   - An abuse contact: none is published yet; GET /mcp says so.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # Secrets can't be used in a job-level `if`, so detect them here and gate the rest.
      # Until Cloudflare is set up, the job skips (green) instead of failing.
      - name: Check Cloudflare config
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Cloudflare deploy: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set."
          fi

      # Full history: each docs page's "Updated" date is its file's last commit.
      - uses: actions/checkout@v4
        if: steps.cf.outputs.configured == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.configured == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
            workers/docs-mcp/package-lock.json

      - run: npm ci
        if: steps.cf.outputs.configured == 'true'

      # The playground is its own package; `npm run build` builds it into dist/playground.
      - run: npm ci --prefix playground
        if: steps.cf.outputs.configured == 'true'

      # Never deploy a cookbook whose recipes drift from their recordings.
      - name: Check cookbook
        if: steps.cf.outputs.configured == 'true'
        run: npm run cookbook:check

      # Never deploy docs that fail their checks (scripts/docs.ts).
      - name: Check docs
        if: steps.cf.outputs.configured == 'true'
        run: npm run docs:check

      - name: Build site
        if: steps.cf.outputs.configured == 'true'
        run: npm run build

      - name: Check built docs
        if: steps.cf.outputs.configured == 'true'
        run: npm run docs:check -- --built

      # Never deploy a Pages Function that fails its check (runs it under wrangler pages dev, no login).
      - name: Check content negotiation
        if: steps.cf.outputs.configured == 'true'
        run: npm run docs:negotiation-check

      - name: Sanity check
        if: steps.cf.outputs.configured == 'true'
        run: |
          test -s dist/index.html
          test -s dist/wasm/relate_bg.wasm
          test -s dist/wasm/relate.js
          test -s dist/playground/index.html
          test -s dist/CNAME

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The version docs:negotiation-check and workers/docs-mcp pin, so the
          # function deployed is compiled by the wrangler that checked it.
          wranglerVersion: "4.158.0"
          command: pages deploy dist --project-name=relate-web --branch=${{ github.head_ref || github.ref_name }}

      # The hosted docs MCP server, after the site and only from main. The
      # package pins its own wrangler, so it deploys with that one rather than
      # through wrangler-action. `npm run bundle` reads the dist/ built above.
      - name: Install the docs MCP Worker
        if: steps.cf.outputs.configured == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm ci --prefix workers/docs-mcp

      - name: Bundle the docs MCP Worker
        if: steps.cf.outputs.configured == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run bundle --prefix workers/docs-mcp

      # Never deploy a Worker that fails its smoke test (runs it under wrangler dev, no login).
      - name: Check the docs MCP Worker
        if: steps.cf.outputs.configured == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/docs-mcp-check.ts

      - name: Deploy the docs MCP Worker
        if: steps.cf.outputs.configured == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: workers/docs-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy
