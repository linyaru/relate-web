<svg id="d-tool-call-provenance-1-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 521px;" viewBox="-263 -157 521 303" role="img" aria-labelledby="d-tool-call-provenance-1-dark-title d-tool-call-provenance-1-dark-desc"><title id="d-tool-call-provenance-1-dark-title">Data model: the agent's memory, and the trace of every call beside it</title><desc id="d-tool-call-provenance-1-dark-desc">A Session HAS_CALL each of its ToolCall nodes, with a timestamp; a ToolCall records its sequence number, tool name, the user's ask, status, row count and any error. Each ToolCall TOUCHED the Entity, Fact and Decision nodes of the agent's memory that it returned, and facts and decisions are ABOUT entities.</desc><style>#d-tool-call-provenance-1-dark{font-family:"Relate Sans",system-ui,sans-serif}#d-tool-call-provenance-1-dark text{text-anchor:middle}#d-tool-call-provenance-1-dark .rel{fill:none;stroke:#80808A;stroke-width:2}#d-tool-call-provenance-1-dark .dash{stroke-dasharray:6 4}#d-tool-call-provenance-1-dark .head{fill:#80808A}#d-tool-call-provenance-1-dark .node circle{stroke-width:2}#d-tool-call-provenance-1-dark .label{font-size:14px;font-weight:600;fill:#0A1114}#d-tool-call-provenance-1-dark .props{font-size:12px;font-weight:400;fill:#0A1114;fill-opacity:0.78}#d-tool-call-provenance-1-dark .type,#d-tool-call-provenance-1-dark .rprops{stroke:#18181C;stroke-width:5px;stroke-linejoin:round;paint-order:stroke}#d-tool-call-provenance-1-dark .type{font-size:12px;font-weight:600;fill:#F1F1F3}#d-tool-call-provenance-1-dark .rprops{font-size:11px;font-weight:400;fill:#9B9BA3}</style><g><path class="rel" d="M-168.9,-53.9 C-136.1,-60.2 -103.3,-66.5 -70.5,-72.8"/><path class="head" d="M-63.6,-74.1 L-72.6,-67.8 L-74.3,-76.7 Z"/><path class="rel" d="M22.8,-34.7 C37.9,-7.9 53.1,19 68.2,45.9"/><path class="head" d="M71.6,52 L62.8,45.5 L70.7,41 Z"/><path class="rel" d="M-26.2,-31 C-37.5,-1 -48.8,29 -60.2,59"/><path class="head" d="M-62.6,65.6 L-63.3,54.7 L-54.9,57.8 Z"/><